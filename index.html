uaciones de 20 puntos (admite medios puntos):","it":false},{"t":"table","rows":[["Puntaje","Nota","Puntaje","Nota"],["0","1,0","10,5","3,1"],["0,5","1,1","11","3,2"],["1","1,2","11,5","3,3"],["1,5","1,3","12","3,4"],["2","1,4","12,5","3,5"],["2,5","1,5","13","3,6"],["3","1,6","13,5","3,7"],["3,5","1,7","14","3,8"],["4","1,8","14,5","3,9"],["4,5","1,9","15","4,0"],["5","2,0","15,5","4,3"],["5,5","2,1","16","4,6"],["6","2,2","16,5","4,9"],["6,5","2,3","17","5,2"],["7","2,4","17,5","5,5"],["7,5","2,5","18","5,8"],["8","2,6","18,5","6,1"],["8,5","2,7","19","6,4"],["9","2,8","19,5","6,7"],["9,5","2,9","20","7,0"],["10","3,0","",""]]},{"t":"p","x":"La nota final del curso es el promedio simple de las cinco notas de módulo, aproximado a un decimal. Si se usa una evaluación con otro puntaje total, basta aplicar la fórmula con el nuevo Pmax.","it":false}]},{"title":"Anexo 2. Pautas de respuesta (uso docente)","blocks":[{"t":"p","x":"Retirar este anexo antes de entregar el material a los participantes.","it":true},{"t":"table","rows":[["Módulo","Respuestas correctas, Parte A (preguntas 1 a 10)"],["1","1-d · 2-c · 3-b · 4-b · 5-d · 6-d · 7-c · 8-c · 9-a · 10-c"],["2","1-b · 2-c · 3-b · 4-c · 5-b · 6-a · 7-a · 8-a · 9-b · 10-d"],["3","1-b · 2-d · 3-a · 4-a · 5-b · 6-d · 7-b · 8-c · 9-c · 10-c"],["4","1-c · 2-d · 3-c · 4-d · 5-c · 6-a · 7-d · 8-c · 9-c · 10-a"],["5","1-a · 2-d · 3-c · 4-c · 5-c · 6-a · 7-c · 8-d · 9-a · 10-b"]]},{"t":"h2","x":"Orientaciones para corregir los casos prácticos"},{"t":"h3","x":"Módulo 1"},{"t":"ul","items":[{"x":"Las tres tareas exceden la función: redactar resoluciones es función jurisdiccional y administrativa; cuidar a los niños en la sala de espera no guarda relación con la especialidad (Guía Academia Judicial); intervenir terapéuticamente es propio de los programas.","l":0},{"x":"Debe citar el art. 5 de la Ley 19.968, el art. 457 del COT, el Acta 93-2005 y el AD-1909-2015.","l":0},{"x":"La respuesta debe ser colaborativa: explicar el marco normativo, ofrecer apoyo dentro del rol (por ejemplo, revisar con la administración la distribución de cargas en el plan anual) y no negarse a todo sin fundamento.","l":0}]},{"t":"h3","x":"Módulo 2"},{"t":"ul","items":[{"x":"Debe descartar la declaración frente a ambos padres y también que baste la entrevista de la curadora ad litem (criterio de la Corte Suprema, Rol 40.161-2025).","l":0},{"x":"Debe proponer una audiencia reservada, en un espacio adecuado (Acta 237-2014; art. 5 b), preparada con el niño y conducida por el juez.","l":0},{"x":"La opinión de Matías se pondera según su edad y madurez (art. 16 Ley 19.968; arts. 7 y 28 Ley 21.430; CDN art. 12), sin pedirle que elija entre sus padres.","l":0}]},{"t":"h3","x":"Módulo 3"},{"t":"ul","items":[{"x":"Debe advertir que el informe no explica las inasistencias ni recoge la voz de la niña, y que la adherencia parcial no basta por sí sola para prorrogar.","l":0},{"x":"Debe considerar la opinión de la niña, su escolaridad y la red familiar (abuela materna), con criterios de proporcionalidad y menor intervención.","l":0},{"x":"La opinión debe proponer algo concreto: por ejemplo, pedir al programa un informe complementario en un plazo breve, o una prórroga acotada con objetivos verificables.","l":0}]},{"t":"h3","x":"Módulo 4"},{"t":"ul","items":[{"x":"Debe advertir que el art. 100 inc. 2 es aplicable porque la denuncia fue de un tercero (la hermana), y que exige su informe previo.","l":0},{"x":"Debe identificar riesgo alto: armas inscritas, dependencia económica, hijos en común y posible retractación por dependencia.","l":0},{"x":"Debe evaluar si la voluntad de la víctima es libre y espontánea; si no puede descartarse el riesgo, debe informarlo así y puede sugerir medidas cautelares.","l":0}]},{"t":"h3","x":"Módulo 5"},{"t":"ul","items":[{"x":"La opinión debe seguir la estructura del punto 5.4 y terminar en una sugerencia verificable.","l":0},{"x":"No hay situaciones del art. 106 que excluyan la mediación (no hay denuncias ni medidas vigentes), pero el temor de la madre debe evaluarse antes; la conciliación con bases graduales es una alternativa razonable.","l":0},{"x":"Sesgos esperables: estereotipos sobre la madre que se opone o sobre el padre ausente; sesgo de confirmación. Estrategias: contrastar hipótesis, consultar a un colega, separar hechos de interpretaciones.","l":0}]}]},{"title":"Anexo 3. Tabla resumen de jurisprudencia","blocks":[{"t":"table","rows":[["Tribunal y rol","Fecha","Criterio","Módulo"],["CS 124-2015","18-08-2015","El derecho a ser oído comprende expresar su parecer; los trámites esenciales no son taxativos.","2"],["CS 35.252-2016","2016","Niña de 11 años con «germen de autonomía» debe ser oída directamente.","2"],["CS 15.277-2025","14-01-2026","Derecho a ser oído como defensa material; nulidad por no oír a los niños.","2"],["CS 40.161-2025","29-05-2026","La entrevista del curador ad litem no reemplaza la escucha directa; no depende del acuerdo de los padres.","2 y 5"],["CS 41.051-2016","2016","Protección en la familia de origen y extensa.","3"],["CS 11.782-2014","2014","Estabilidad y sentimiento de pertenencia como parte del interés superior.","3"],["CS 4.827-2017","2017","Cuidado personal centrado en el niño como sujeto de derechos.","3"],["CS 5.127-2014 y 6.323-2015","2014-2015","La valoración de informes conforme a la sana crítica corresponde a los jueces del fondo.","3"],["CS 25.069-2024","25-07-2024","Amenazar con quitar el cuidado personal y descalificar a la madre constituye VIF.","4"],["CS 15.278-2025","19-06-2025","Violencia vicaria e interés superior en una autorización de salida del país.","4"],["CS 38.704-2025","19-11-2025","Término del proceso a requerimiento de una víctima mayor (art. 100).","4"],["CA Santiago 168-2025","01-12-2025","Se confirma revinculación gradual sugerida por el consejero técnico.","5"]]},{"t":"p","x":"Fuentes: Corte Suprema y Cortes de Apelaciones; Dirección de Estudios de la Corte Suprema (2019); Observatorio Jurisprudencial del Programa Persona, Familias y Derecho de la Universidad de Chile; Secretaría Técnica de Igualdad de Género y No Discriminación del Poder Judicial. Los resúmenes son paráfrasis docentes: leer la sentencia completa en juris.pjud.cl antes de citarla.","it":true}]},{"title":"Anexo 4. Guiones de simulación para las clases","blocks":[{"t":"p","x":"Cada simulación dura entre 30 y 40 minutos. Se recomienda grabar (con acuerdo del grupo) o cronometrar la opinión oral, y cerrar con retroalimentación usando la lista de verificación del Anexo 5.","it":false},{"t":"h2","x":"Simulación 1 (Módulo 1). Tareas que exceden la función"},{"t":"table","rows":[["Elemento","Descripción"],["Roles","Administradora del tribunal, consejera técnica, juez presidente."],["Situación","La administradora pide a la consejera cubrir la recepción de público y redactar citaciones durante una semana de licencias médicas."],["Tarea de la consejera o consejero","La consejera explica el marco normativo (art. 5 Ley 19.968; art. 457 COT; AD-1909-2015) y propone alternativas dentro del plan anual."],["Preguntas para la retroalimentación","¿Se mantuvo una relación colaborativa? ¿Se citaron las normas con precisión?"]]},{"t":"h2","x":"Simulación 2 (Módulo 2). Audiencia reservada"},{"t":"table","rows":[["Elemento","Descripción"],["Roles","Juez, consejera técnica, niña de 10 años (participante voluntaria), curadora ad litem."],["Situación","Causa de cuidado personal. La niña llega nerviosa y dice que su mamá le pidió que dijera que quiere vivir con ella."],["Tarea de la consejera o consejero","La consejera asesora al juez antes, durante y después de la escucha; evita preguntas que obliguen a elegir; ayuda a ponderar posibles influencias."],["Preguntas para la retroalimentación","¿Se informó a la niña de su derecho a no hablar? ¿Se trató lo que a ella le importaba?"]]},{"t":"h2","x":"Simulación 3 (Módulo 3). Audiencia de revisión de medida"},{"t":"table","rows":[["Elemento","Descripción"],["Roles","Juez, consejero técnico, profesional del programa, madre, abogado de la madre, curador ad litem."],["Situación","El programa pide prorrogar por un año una medida de intervención; la madre afirma que nunca le ofrecieron horarios compatibles con su trabajo."],["Tarea de la consejera o consejero","El consejero analiza el informe con los criterios del punto 3.4 y propone una prórroga acotada, con objetivos y plazos, o un informe complementario."],["Preguntas para la retroalimentación","¿La opinión fue imparcial respecto del programa? ¿La sugerencia es verificable?"]]},{"t":"h2","x":"Simulación 4 (Módulo 4). Evaluación de riesgo y término del proceso"},{"t":"table","rows":[["Elemento","Descripción"],["Roles","Juez, consejera técnica, víctima, denunciado, abogados."],["Situación","La víctima, adulta mayor, pide terminar el proceso iniciado por denuncia de su hijo; refiere que su pareja administra su pensión."],["Tarea de la consejera o consejero","La consejera evalúa riesgo y voluntad libre (art. 100 inc. 2), considerando autonomía y violencia económica, y emite un informe oral."],["Preguntas para la retroalimentación","¿Se distinguió autonomía de dependencia? ¿Se evitó la victimización secundaria?"]]},{"t":"h2","x":"Simulación 5 (Módulo 5). Opinión oral cronometrada"},{"t":"table","rows":[["Elemento","Descripción"],["Roles","Juez, consejero técnico, padre, madre, abogados."],["Situación","Audiencia preparatoria de relación directa y regular; el juez da 4 minutos para la opinión."],["Tarea de la consejera o consejero","El consejero aplica la estructura de cinco pasos y evalúa si corresponde conciliación (arts. 5 c y 106)."],["Preguntas para la retroalimentación","¿Respetó el tiempo? ¿Separó hechos de interpretaciones? ¿Señaló los límites de su opinión?"]]}]},{"title":"Anexo 5. Modelos de opinión técnica","blocks":[{"t":"h2","x":"Modelo de opinión oral (pauta de 3 a 5 minutos)"},{"t":"table","rows":[["Paso","Fórmula sugerida"],["1. Encuadre","«Su Señoría, se me consulta sobre…»"],["2. ey 21.302, crea el Servicio Nacional de Protección Especializada a la Niñez y Adolescencia.","l":0},{"x":"Ley 21.378, monitoreo telemático en violencia intrafamiliar.","l":0},{"x":"Ley 21.430, sobre Garantías y Protección Integral de los Derechos de la Niñez y Adolescencia (arts. 7, 11 y 28).","l":0},{"x":"Ley 21.675, sobre violencia contra las mujeres (arts. 3, 5 y 33).","l":0},{"x":"Convención sobre los Derechos del Niño (arts. 3 y 12) y Observación General N° 14 del Comité de los Derechos del Niño.","l":0},{"x":"Convención Interamericana sobre la Protección de los Derechos Humanos de las Personas Mayores (arts. 7 y 31).","l":0},{"x":"Actas de la Corte Suprema: 93-2005, 104-2005, 98-2009, 135-2010, 37-2014, 237-2014, 71-2016; AD-1909-2015; AD-826-2016.","l":0}]},{"t":"h2","x":"Jurisprudencia"},{"t":"ul","items":[{"x":"Ver Anexo 3. Buscador de jurisprudencia del Poder Judicial: juris.pjud.cl.","l":0}]},{"t":"h2","x":"Documentos de consulta"},{"t":"ul","items":[{"x":"Academia Judicial (2026). Guía de buenas prácticas para la consejería técnica en tribunales de familia.","l":0},{"x":"Academia Judicial (2024). Guía para la conducción de las audiencias de familia: preparatoria, reservada, conciliación y juicio oral.","l":0},{"x":"Dirección de Estudios de la Corte Suprema (2019). El interés superior del niño, niña y adolescente y su aplicación en la jurisprudencia de la Segunda y Cuarta Sala de la Corte Suprema.","l":0},{"x":"Henríquez Galindo, S. El Consejo Técnico de los Tribunales de Familia de Chile. Regulación, límites y proyección. Revista de Derecho y Estudios Procesales, Universidad de Chile.","l":0},{"x":"Carretta Muñoz, F. (2018). El derecho del niño a ser oído en la justicia de familia. Revista Chilena de Derecho, 45(2), 407-426.","l":0}]}]}],"keys":[{"mod":1,"key":"1-d · 2-c · 3-b · 4-b · 5-d · 6-d · 7-c · 8-c · 9-a · 10-c"},{"mod":2,"key":"1-b · 2-c · 3-b · 4-c · 5-b · 6-a · 7-a · 8-a · 9-b · 10-d"},{"mod":3,"key":"1-b · 2-d · 3-a · 4-a · 5-b · 6-d · 7-b · <script>
"use strict";
const D=JSON.parse(document.getElementById('data').textContent);
const $app=document.getElementById('app');
// ---------- almacenamiento (tolerante a fallos) ----------
const store={get(k,d){try{const v=localStorage.getItem('ctpjud:'+k);return v===null?d:JSON.parse(v);}catch(e){return mem[k]!==undefined?mem[k]:d;}},
  set(k,v){mem[k]=v;try{localStorage.setItem('ctpjud:'+k,JSON.stringify(v));}catch(e){}}};
const mem={};
// ---------- utilidades ----------
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md=s=>esc(s).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
const fmt=n=>n.toFixed(1).replace('.',',');
const nota=(p,max)=>{const c=0.75*max;const n=p<c?1+3*p/c:4+3*(p-c)/(max-c);return Math.round(n*10)/10;};
const secciones=D.sections.filter(s=>s.title!=='Contenido');
const modulos=secciones.filter(s=>/^Módulo \d/.test(s.title));
const anexos=secciones.filter(s=>/^Anexo/.test(s.title));
const presentacion=secciones.find(s=>/^Presentación/.test(s.title));
const evalDe=m=>modulos[m-1].blocks.find(b=>b.t==='eval');
const corto=t=>t.replace(/^Módulo \d+\.\s*/,'').replace(/^Anexo \d+\.\s*/,'');
// ---------- render de bloques ----------
function tabla(rows){
  const h=rows[0],multi=h.length>2;
  const cell=c=>String(c).split('|').map(md).join('<br>');
  let s=`<div class="tw"><table class="${multi?'stack':''}"><thead><tr>${h.map(c=>`<th>${cell(c)}</th>`).join('')}</tr></thead><tbody>`;
  rows.slice(1).forEach(r=>{s+='<tr>'+r.map((c,i)=>`<td data-h="${esc(h[i])}">${cell(c)}</td>`).join('')+'</tr>';});
  return s+'</tbody></table></div>';
}
function bloques(bl,mod){
  return bl.map(b=>{switch(b.t){
    case 'h2':return `<h3>${md(b.x)}</h3>`;
    case 'h3':return `<h4>${md(b.x)}</h4>`;
    case 'p':return b.it?`<p class="aviso">${md(b.x)}</p>`:`<p>${md(b.x)}</p>`;
    case 'ul':return '<ul>'+b.items.map(i=>`<li class="${i.l?'l1':''}">${md(i.x)}</li>`).join('')+'</ul>';
    case 'ol':return '<ol>'+b.items.map(i=>`<li>${md(i.x)}</li>`).join('')+'</ol>';
    case 'table':return tabla(b.rows);
    case 'box':return `<div class="box ${b.kind}"><div class="bt">${md(b.title)}</div>${b.lines.map(l=>`<p>${md(l)}</p>`).join('')}</div>`;
    case 'fallo':return `<div class="box fallo"><div class="bt">${md(b.tribunal)}, Rol N° ${md(b.rol)} (${md(b.fecha)})</div><p><strong>Materia:</strong> ${md(b.materia)}</p><p><strong>Hechos:</strong> ${md(b.hechos)}</p><p><strong>Criterio:</strong> ${md(b.criterio)}</p><p><strong>Lección para la consejería técnica:</strong> ${md(b.leccion)}</p></div>`;
    case 'eval':{const r=store.get('res'+b.mod,null);
      return `<h3>Evaluación del Módulo ${b.mod}</h3><div class="card"><p>20 puntos: 10 preguntas de selección múltiple y un caso práctico con rúbrica. Exigencia del 75 % (15 puntos = nota 4,0).</p>${r?`<p>Último resultado: <span class="pill ${r.nota>=4?'ok':'mal'}">Nota ${fmt(r.nota)}</span></p>`:''}<a class="btn" href="#eval-${b.mod}">${r?'Volver a rendir':'Rendir evaluación'}</a></div>`;}
    default:return '';}}).join('');
}
// ---------- vistas ----------
function vInicio(){
  const res=[1,2,3,4,5].map(m=>store.get('res'+m,null));
  const hechas=res.filter(Boolean);
  const final=hechas.length===5?Math.round(hechas.reduce((a,r)=>a+r.nota,0)/5*10)/10:null;
  let s=`<h2 class="sec">Curso de Especialización en Consejería Técnica</h2>
  <p>Funciones, competencias, marco normativo y jurisprudencia de la consejería técnica en los tribunales de familia del Poder Judicial de Chile.</p>
  <a class="card" href="#presentacion"><div class="tit">Presentación del curso</div><div class="muted">Objetivos, metodología, evaluación y planificación de sesiones</div></a>
  <h3>Tu avance</h3>`;
  modulos.forEach((m,i)=>{const r=res[i];
    s+=`<a class="card" href="#modulo-${i+1}"><div class="tit">Módulo ${i+1}</div><div>${esc(corto(m.title))}</div><div style="margin-top:6px">${r?`<span class="pill ${r.nota>=4?'ok':'mal'}">Nota ${fmt(r.nota)}</span>`:'<span class="pill pend">Evaluación pendiente</span>'}</div></a>`;});
  s+=`<div class="card"><div class="tit">Nota final del curso</div>${final!==null?`<p><span class="pill ${final>=4?'ok':'mal'}">${fmt(final)} · ${final>=4?'Aprobado':'Reprobado'}</span></p>`:`<p class="muted">Se calcula al rendir los 5 módulos (llevas ${hechas.length} de 5).</p>`}</div>`;
  return ['Consejería Técnica PJUD',s,'inicio',false];
}
function vModulos(){
  let s='<h2 class="sec">Módulos</h2>';
  modulos.forEach((m,i)=>{s+=`<a class="card" href="#modulo-${i+1}"><div class="tit">Módulo ${i+1}</div><div>${esc(corto(m.title))}</div></a>`;});
  return ['Módulos',s,'modulos',false];
}
function vSeccion(sec,tab,titulo){
  return [titulo,`<h2 class="sec">${esc(sec.title)}</h2>`+bloques(sec.blocks),tab,true];
}
function vModulo(n){
  const m=modulos[n-1];if(!m)return vNoEncontrado();
  const nav=`<div class="row">${n>1?`<a class="btn sec" href="#modulo-${n-1}">‹ Módulo ${n-1}</a>`:'<span></span>'}${n<5?`<a class="btn sec" href="#modulo-${n+1}">Módulo ${n+1} ›</a>`:'<span></span>'}</div>`;
  const ir=`<a class="btn sec" href="#eval-${n}">Ir a la evaluación</a>`;
  return ['Módulo '+n,`<h2 class="sec">${esc(m.title)}</h2>${ir}`+bloques(m.blocks,n)+nav,'modulos',true];
}
function vAnexos(){
  const docente=store.get('docente',false);
  let s='<h2 class="sec">Anexos</h2>';
  anexos.forEach((a,i)=>{const n=a.title.match(/^Anexo (\d+)/)[1];
    if(n==='2'&&!docente)return;
    s+=`<a class="card" href="#anexo-${n}"><div class="tit">Anexo ${n}</div><div>${esc(corto(a.title))}</div></a>`;});
  if(!docente)s+='<p class="aviso">Las pautas de respuesta (Anexo 2) solo se muestran en modo docente, que se activa en la pestaña Notas.</p>';
  return ['Anexos',s,'anexos',false];
}
function vAnexo(n){
  const a=anexos.find(x=>x.title.startsWith('Anexo '+n+'.'));
  if(!a||(n==='2'&&!store.get('docente',false)))return vNoEncontrado();
  return vSeccion(a,'anexos','Anexo '+n);
}
function vNotas(){
  const docente=store.get('docente',false);
  let s='<h2 class="sec">Notas</h2><div class="tw"><table><thead><tr><th>Módulo</th><th>Puntaje</th><th>Nota</th></tr></thead><tbody>';
  const res=[1,2,3,4,5].map(m=>store.get('res'+m,null));
  res.forEach((r,i)=>{s+=`<tr><td>Módulo ${i+1}</td><td>${r?String(r.total).replace('.',',')+' / 20':'—'}</td><td>${r?`<span class="pill ${r.nota>=4?'ok':'mal'}">${fmt(r.nota)}</span>`:'—'}</td></tr>`;});
  const hechas=res.filter(Boolean);
  const final=hechas.length===5?Math.round(hechas.reduce((a,r)=>a+r.nota,0)/5*10)/10:null;
  s+=`<tr><th>Nota final</th><th></th><th>${final!==null?fmt(final):'—'}</th></tr></tbody></table></div>`;
  s+=`<h3>Calculadora de notas (exigencia 75 %)</h3><div class="card"><div class="row"><label>Puntaje obtenido<input type="number" id="cp" min="0" step="0.5" value="15" inputmode="decimal"></label><label>Puntaje máximo<input type="number" id="cm" min="1" step="1" value="20" inputmode="decimal"></label></div><div class="result ok" id="cr" style="margin-top:12px"></div></div>`;
  s+=`<h3>Ajustes</h3><div class="card"><label class="toggle"><span>Modo docente (muestra el Anexo 2 con las pautas de respuesta)</span><input type="checkbox" id="doc" ${docente?'checked':''}></label></div>
  <div class="card"><p>Borra todas las notas guardadas en este teléfono.</p><button class="btn sec" id="reset">Borrar mis notas</button></div>`;
  return ['Notas',s,'notas',false];
}
function vNoEncontrado(){return ['Consejería Técnica PJUD','<p>Esta sección no existe.</p><a class="btn" href="#inicio">Ir al inicio</a>','inicio',true];}
// ---------- evaluación ----------
function vEval(n){
  const e=evalDe(n);if(!e)return vNoEncontrado();
  const st=store.get('borrador'+n,{a:{},r:{},notas:''});
  let s=`<h2 class="sec">Evaluación del Módulo ${n}</h2><div class="box info"><div class="bt">Instrucciones</div><p>Parte A: 10 preguntas de selección múltiple, 1 punto cada una. Parte B: caso práctico, 10 puntos, corregido con la rúbrica (por la docente o como autoevaluación).</p><p>Exigencia: 75 % (15 de 20 puntos = nota 4,0).</p></div><h3>Parte A. Selección múltiple</h3>`;
  e.qs.forEach((q,i)=>{s+=`<div class="q" id="q${i}"><div class="enun">${i+1}. ${md(q.q)}</div>`+q.o.map((o,k)=>`<label class="opt ${st.a[i]===k?'sel':''}" data-q="${i}" data-k="${k}"><input type="radio" name="q${i}" value="${k}" ${st.a[i]===k?'checked':''}><span>${'abcd'[k]}) ${md(o)}</span></label>`).join('')+'<div class="fb"></div></div>';});
  s+='<h3>Parte B. Caso práctico</h3>'+e.caso.map(t=>`<p>${md(t)}</p>`).join('');
  s+=`<label class="muted" for="resp">Tu respuesta (se guarda en este teléfono):</label><textarea id="resp">${esc(st.notas||'')}</textarea><h4>Rúbrica</h4>`;
  e.rubrica.forEach((r,i)=>{const v=st.r[i];
    s+=`<div class="rub" id="r${i}"><div>${md(r.x)} <span class="muted">(${String(r.pts).replace('.',',')} pts)</span></div><div class="seg">`+
    [['Logrado',1],['Parcial',0.5],['No logrado',0]].map(([l,f])=>`<label class="${v===f?'sel':''}" data-r="${i}" data-f="${f}"><input type="radio" name="r${i}" value="${f}">${l}<br><span class="muted">${String(r.pts*f).replace('.',',')}</span></label>`).join('')+'</div></div>';});
  s+=`<p class="aviso" id="faltan"></p><button class="btn" id="corregir">Corregir y calcular nota</button><div id="resultado"></div><a class="btn sec" href="#modulo-${n}">Volver al módulo</a>`;
  return ['Evaluación '+n,s,'modulos',true,()=>bindEval(n,e)];
}
function bindEval(n,e){
  const st=store.get('borrador'+n,{a:{},r:{},notas:''});
  const save=()=>store.set('borrador'+n,st);
  $app.querySelectorAll('.opt').forEach(l=>l.addEventListener('click',ev=>{
    if($app.dataset.corregida)return;
    const i=+l.dataset.q,k=+l.dataset.k;st.a[i]=k;save();
    $app.querySelectorAll(`.opt[data-q="${i}"]`).forEach(x=>x.classList.toggle('sel',+x.dataset.k===k));
    l.querySelector('input').checked=true;}));
  $app.querySelectorAll('.seg label').forEach(l=>l.addEventListener('click',()=>{
    if($app.dataset.corregida)return;
    const i=+l.dataset.r,f=+l.dataset.f;st.r[i]=f;save();
    $app.querySelectorAll(`.seg label[data-r="${i}"]`).forEach(x=>x.classList.toggle('sel',+x.dataset.f===f));}));
  const ta=document.getElementById('resp');ta.addEventListener('input',()=>{st.notas=ta.value;save();});
  document.getElementById('corregir').addEventListener('click',()=>{
    const faltaQ=e.qs.map((q,i)=>i).filter(i=>st.a[i]===undefined);
    const faltaR=e.rubrica.map((r,i)=>i).filter(i=>st.r[i]===undefined);
    const f=document.getElementById('faltan');
    if(faltaQ.length||faltaR.length){
      f.textContent=(faltaQ.length?`Faltan las preguntas ${faltaQ.map(i=>i+1).join(', ')}. `:'')+(faltaR.length?`Falta evaluar ${faltaR.length} criterio(s) de la rúbrica.`:'');
      document.getElementById(faltaQ.length?'q'+faltaQ[0]:'r'+faltaR[0]).scrollIntoView({behavior:'smooth',block:'center'});return;}
    f.textContent='';
    let a=0;e.qs.forEach((q,i)=>{const ok=st.a[i]===q.c;if(ok)a++;
      const box=document.getElementById('q'+i);
      box.querySelectorAll('.opt').forEach(x=>{const k=+x.dataset.k;x.classList.remove('sel');if(k===q.c)x.classList.add('correcta');else if(k===st.a[i])x.classList.add('incorrecta');x.querySelector('input').disabled=true;});
      const fb=box.querySelector('.fb');fb.className='fb '+(ok?'ok':'mal');fb.textContent=ok?'✓ Correcta':`✗ Incorrecta. Respuesta correcta: ${'abcd'[q.c]})`;});
    const bpts=e.rubrica.reduce((s,r,i)=>s+r.pts*st.r[i],0);
    const total=a+bpts,nf=nota(total,20);
    store.set('res'+n,{a,b:bpts,total,nota:nf,fecha:new Date().toISOString()});
    $app.dataset.corregida='1';
    document.getElementById('corregir').hidden=true;
    document.getElementById('resultado').innerHTML=`<div class="result ${nf>=4?'ok':'mal'}" id="res"><div>Parte A: ${a} / 10 · Parte B: ${String(bpts).replace('.',',')} / 10</div><div>Total: ${String(total).replace('.',',')} / 20</div><div class="nota">${fmt(nf)}</div><div><strong>${nf>=4?'Aprobado':'Reprobado'}</strong></div></div><button class="btn sec" id="otra">Rendir de nuevo</button>`;
    document.getElementById('otra').addEventListener('click',()=>{store.set('borrador'+n,{a:{},r:{},notas:st.notas});delete $app.dataset.corregida;render();window.scrollTo(0,0);});
    document.getElementById('res').scrollIntoView({behavior:'smooth',block:'center'});
  });
}
// ---------- enrutador ----------
function render(){
  const h=location.hash.replace(/^#\/?/,'').replace('/','-').split('-');if(h[0]==='inicio')h[0]='';
  let v;
  if(!h[0])v=vInicio();
  else if(h[0]==='modulos')v=vModulos();
  else if(h[0]==='modulo')v=vModulo(+h[1]);
  else if(h[0]==='eval')v=vEval(+h[1]);
  else if(h[0]==='presentacion')v=vSeccion(presentacion,'inicio','Presentación');
  else if(h[0]==='anexos')v=vAnexos();
  else if(h[0]==='anexo')v=vAnexo(h[1]);
  else if(h[0]==='notas')v=vNotas();
  else v=vNoEncontrado();
  delete $app.dataset.corregida;
  document.getElementById('title').textContent=v[0];
  $app.innerHTML=v[1];
  document.querySelectorAll('nav.tabs a').forEach(a=>a.classList.toggle('on',a.dataset.tab===v[2]));
  document.getElementById('back').hidden=!v[3];
  if(v[4])v[4]();
  if(h[0]==='notas')bindNotas();
}
function bindNotas(){
  const cp=document.getElementById('cp'),cm=document.getElementById('cm'),cr=document.getElementById('cr');
  const calc=()=>{const p=parseFloat(String(cp.value).replace(',','.')),m=parseFloat(String(cm.value).replace(',','.'));
    if(!(m>0)||!(p>=0)||p>m){cr.className='result mal';cr.innerHTML='Revisa los valores: el puntaje debe estar entre 0 y el máximo.';return;}
    const n=nota(p,m);cr.className='result '+(n>=4?'ok':'mal');cr.innerHTML=`<div class="nota">${fmt(n)}</div><div>${n>=4?'Aprobado':'Reprobado'} · nota 4,0 con ${String(Math.round(0.75*m*100)/100).replace('.',',')} puntos</div>`;};
  cp.addEventListener('input',calc);cm.addEventListener('input',calc);calc();
  document.getElementById('doc').addEventListener('change',ev=>store.set('docente',ev.target.checked));
  const rb=document.getElementById('reset');rb.addEventListener('click',()=>{if(!rb.dataset.c){rb.dataset.c='1';rb.textContent='Toca de nuevo para confirmar el borrado';return;}[1,2,3,4,5].forEach(m=>{store.set('res'+m,null);store.set('borrador'+m,{a:{},r:{},notas:''});});render();});
}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);});
document.getElementById('back').addEventListener('click',()=>{if(history.length>1)history.back();else location.hash='#inicio';});
let fs=store.get('fs',17);const setFs=v=>{fs=Math.min(24,Math.max(14,v));document.documentElement.style.setProperty('--fs',fs+'px');store.set('fs',fs);};
setFs(fs);
document.getElementById('fsminus').addEventListener('click',()=>setFs(fs-1));
document.getElementById('fsplus').addEventListener('click',()=>setFs(fs+1));
render();
try{if('serviceWorker' in navigator&&location.protocol!=='file:'){navigator.serviceWorker.register('sw.js').catch(()=>{});}}catch(e){}
</script>
