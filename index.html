:root{--azul:#1F3864;--azul2:#2E74B5;--celeste:#DEEAF6;--verde:#E2EFDA;--amarillo:#FFF2CC;--gris:#F2F2F2;--borde:#C9CED6;--texto:#1d1d1f;--ok:#2E7D32;--mal:#C62828;--fs:17px}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Comic Sans MS","CursoComic",cursive;font-size:var(--fs);line-height:1.55;color:var(--texto);background:#fafbfc;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--azul);color:#fff;display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top))}
header h1{font-size:1.02em;margin:0;flex:1;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header button{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:8px;min-width:40px;min-height:40px;font:inherit;font-size:.9em}
main{padding:14px 14px 96px;max-width:820px;margin:0 auto}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:5;background:#fff;border-top:1px solid var(--borde);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs a{flex:1;text-align:center;padding:8px 2px 10px;color:#555;text-decoration:none;font-size:.78em;line-height:1.2}
nav.tabs a .i{display:block;font-size:1.45em;line-height:1.2}
nav.tabs a.on{color:var(--azul);font-weight:700}
h2.sec{color:var(--azul);font-size:1.3em;line-height:1.3;margin:6px 0 12px}
h3{color:var(--azul2);font-size:1.12em;margin:22px 0 8px;line-height:1.3}
h4{font-size:1.02em;margin:16px 0 6px}
p{margin:0 0 12px}
ul,ol{margin:0 0 12px;padding-left:24px}
li{margin-bottom:6px}
li.l1{margin-left:20px;list-style:circle}
.card{background:#fff;border:1px solid var(--borde);border-radius:12px;padding:14px;margin-bottom:12px}
a.card{display:block;color:inherit;text-decoration:none}
a.card:active{background:var(--celeste)}
.card .tit{font-weight:700;color:var(--azul)}
.muted{color:#666;font-size:.88em}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.82em;font-weight:700}
.pill.ok{background:#E8F5E9;color:var(--ok)}.pill.mal{background:#FFEBEE;color:var(--mal)}.pill.pend{background:#EEE;color:#555}
.tw{overflow-x:auto;margin:0 0 14px;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:.88em;background:#fff}
th,td{border:1px solid var(--borde);padding:7px 8px;vertical-align:top;text-align:left}
th{background:var(--celeste)}
.stack td{display:block;border:none;padding:4px 10px}
.stack tr{display:block;border:1px solid var(--borde);border-radius:10px;margin-bottom:10px;padding:6px 0;background:#fff}
.stack thead{display:none}
.stack td::before{content:attr(data-h);display:block;font-weight:700;color:var(--azul2);font-size:.85em}
.box{border:1px solid var(--borde);border-radius:12px;padding:12px 14px;margin:0 0 14px}
.box.nota{background:var(--amarillo)}.box.info{background:var(--celeste)}.box.gris{background:var(--gris)}.box.fallo{background:var(--verde)}
.box .bt{font-weight:700;margin-bottom:6px}
.box p{margin:0 0 6px}
.btn{display:block;width:100%;text-align:center;background:var(--azul);color:#fff;border:none;border-radius:12px;padding:14px;font:inherit;font-weight:700;margin:10px 0;text-decoration:none;min-height:48px}
.btn.sec{background:#fff;color:var(--azul);border:2px solid var(--azul)}
.btn:disabled{opacity:.5}
.q{background:#fff;border:1px solid var(--borde);border-radius:12px;padding:12px;margin-bottom:12px}
.q .enun{font-weight:700;margin-bottom:8px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--borde);border-radius:10px;margin-bottom:8px;cursor:pointer;min-height:44px}
.opt input{margin-top:5px;width:20px;height:20px;flex:none}
.opt.sel{border-color:var(--azul2);background:var(--celeste)}
.opt.correcta{border-color:var(--ok);background:#E8F5E9}
.opt.incorrecta{border-color:var(--mal);background:#FFEBEE}
.fb{font-size:.9em;font-weight:700;margin-top:4px}
.fb.ok{color:var(--ok)}.fb.mal{color:var(--mal)}
.rub{background:#fff;border:1px solid var(--borde);border-radius:12px;padding:12px;margin-bottom:10px}
.seg{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.seg label{flex:1;min-width:90px;text-align:center;border:1px solid var(--borde);border-radius:10px;padding:10px 4px;cursor:pointer;font-size:.88em}
.seg input{display:none}
.seg label.sel{background:var(--azul2);color:#fff;border-color:var(--azul2)}
.seg label.sel .muted{color:#fff}
textarea{width:100%;min-height:140px;font:inherit;font-size:.95em;border:1px solid var(--borde);border-radius:10px;padding:10px}
.result{border-radius:14px;padding:16px;text-align:center;margin:10px 0 16px;border:2px solid}
.result.ok{background:#E8F5E9;border-color:var(--ok)}.result.mal{background:#FFEBEE;border-color:var(--mal)}
.result .nota{font-size:2.6em;font-weight:700;line-height:1.1}
.row{display:flex;gap:10px}
.row>*{flex:1}
input[type=number]{width:100%;font:inherit;padding:10px;border:1px solid var(--borde);border-radius:10px;min-height:46px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px}
.toggle input{width:24px;height:24px}
.aviso{font-size:.85em;color:#666;font-style:italic}
</style>

<script id="data" type="application/json">{"sections":[{"title":"Contenido","blocks":[{"t":"table","rows":[["Sección","Tema"],["Presentación","Destinatarios, objetivos, metodología, evaluación y planificación de sesiones"],["Módulo 1","Marco normativo e institucional del consejo técnico"],["Módulo 2","Principios rectores: interés superior y derecho a ser oído"],["Módulo 3","Protección de derechos de niños, niñas y adolescentes"],["Módulo 4","Violencia intrafamiliar y violencia de género"],["Módulo 5","Asesoría en audiencia, mediación y elaboración de la opinión técnica"],["Anexo 1","Escala de notas con exigencia del 75 %"],["Anexo 2","Pautas de respuesta y orientaciones de corrección (uso docente)"],["Anexo 3","Tabla resumen de jurisprudencia"],["Anexo 4","Guiones de simulación para las clases"],["Anexo 5","Modelos de opinión técnica oral y escrita"],["Anexo 6","Glosario"],["Anexo 7","Fuentes normativas, jurisprudenciales y de consulta"]]}]},{"title":"Presentación del curso","blocks":[{"t":"h2","x":"Destinatarios"},{"t":"p","x":"Este curso está dirigido a profesionales del área psicosocial (psicología, trabajo social y afines) que se desempeñan o aspiran a desempeñarse como consejeras y consejeros técnicos en los juzgados de familia y en los juzgados de letras con competencia en familia. Está pensado especialmente para quienes llegan desde la red de protección (Oficinas de Protección de Derechos, programas de reparación en maltrato, programas especializados o residencias) y necesitan reorientar su experiencia hacia el rol de asesoría judicial.","it":false},{"t":"h2","x":"Fundamentación"},{"t":"p","x":"El consejo técnico nació con la Ley 19.968, que creó los tribunales de familia, para que los jueces contaran con una mirada interdisciplinaria al resolver asuntos en que el derecho por sí solo no basta: la relación de un niño con sus padres, el riesgo de una víctima de violencia o la pertinencia de una mediación. Su función es asesorar: no decide, no interviene terapéuticamente y no reemplaza a los peritos. Esa posición intermedia exige competencias específicas que no se adquieren automáticamente con la experiencia clínica o de intervención.","it":false},{"t":"p","x":"Para una profesional que viene de la red de protección, el principal desafío no es técnico sino de rol. En una OPD o en un programa de reparación se evalúa, se diseña un plan y se interviene con la familia. En el tribunal, en cambio, se traduce ese conocimiento en una opinión breve, fundada e imparcial, que debe servir al juez para decidir en una audiencia oral, frente a las partes y sus abogados, y que queda registrada en el audio de la causa.","it":false},{"t":"h2","x":"Objetivo general"},{"t":"p","x":"Consolidar las funciones, habilidades y competencias propias de la consejería técnica en el Poder Judicial, con base en el marco legal, los autos acordados de la Corte Suprema que la regulan y los criterios de la jurisprudencia de los tribunales superiores de justicia.","it":false},{"t":"h2","x":"Objetivos específicos"},{"t":"ol","items":[{"x":"Identificar las normas legales y reglamentarias que crean, integran y regulan el consejo técnico."},{"x":"Aplicar los principios de interés superior del niño, niña o adolescente y de derecho a ser oído en la asesoría al juez."},{"x":"Asesorar en el procedimiento de aplicación judicial de medidas de protección, desde la adopción hasta la revisión de las medidas."},{"x":"Asesorar en la evaluación de riesgo, las medidas cautelares y las salidas alternativas en violencia intrafamiliar, con enfoque de género."},{"x":"Formular opiniones técnicas orales y escritas claras, fundadas, imparciales y útiles para la decisión judicial."},{"x":"Analizar críticamente fallos de la Corte Suprema y de las Cortes de Apelaciones que inciden en la labor del consejo técnico."}]},{"t":"h2","x":"Competencias que desarrolla el curso"},{"t":"table","rows":[["Competencia","Descripción","Módulos"],["Conocimiento normativo","Conoce y cita correctamente las normas que fundan cada actuación.","1 a 5"],["Asesoría técnica","Traduce el saber disciplinario en información útil para la decisión judicial.","3, 4, 5"],["Escucha protegida de NNA","Prepara y acompaña la escucha del niño resguardando su bienestar.","2, 3"],["Evaluación de riesgo","Aplica e interpreta la evaluación de riesgo en VIF con enfoque de género.","4"],["Comunicación oral en audiencia","Expone su opinión de forma breve, estructurada y comprensible.","5"],["Ética e imparcialidad","Identifica implicancias, sesgos y límites de su función.","1, 5"]]},{"t":"h2","x":"Metodología"},{"t":"ul","items":[{"x":"Clases expositivas breves sobre el marco normativo, seguidas de análisis de casos y de jurisprudencia.","l":0},{"x":"Ejercicios de simulación de audiencias (juego de roles: juez, consejera técnica, abogados, curador ad litem).","l":0},{"x":"Preguntas de reflexión al cierre de cada módulo, pensadas para conectar la experiencia previa de los participantes con el nuevo rol.","l":0},{"x":"Lectura obligatoria del texto legal vigente de los artículos citados, disponible en www.bcn.cl/leychile.","l":0}]},{"t":"h2","x":"Sistema de evaluación"},{"t":"ul","items":[{"x":"Cada módulo termina con una evaluación de 20 puntos: 10 preguntas de selección múltiple (1 punto cada una) y un caso práctico (10 puntos) con rúbrica.","l":0},{"x":"Escala de notas de 1,0 a 7,0 con **exigencia del 75 %**: la nota 4,0 se obtiene con el 75 % del puntaje (15 de 20 puntos). La fórmula y la tabla están en el Anexo 1.","l":0},{"x":"Nota final del curso: promedio simple de las cinco evaluaciones (20 % cada una), aproximado a un decimal. Aprobación: nota final igual o superior a 4,0.","l":0},{"x":"Las pautas de respuesta están en el Anexo 2 y son de uso exclusivo de la docente: conviene retirarlas antes de entregar el material a los participantes.","l":0}]},{"t":"h2","x":"Planificación sugerida de sesiones"},{"t":"table","rows":[["Sesión","Contenido","Actividad"],["1","Módulo 1: creación, naturaleza y requisitos del consejo técnico","Exposición y lectura dirigida del art. 5 de la Ley 19.968 y del art. 457 del COT"],["2","Módulo 1: funciones, límites y ética institucional","Análisis de casos de tareas ajenas a la función; evaluación del Módulo 1"],["3","Módulo 2: interés superior y derecho a ser oído","Análisis de los fallos de la Corte Suprema sobre nulidad por no oír al NNA"],["4","Módulo 2: la audiencia reservada","Simulación de audiencia reservada; evaluación del Módulo 2"],["5","Módulo 3: procedimiento de protección","Exposición por etapas, arts. 68 a 80 bis de la Ley 19.968"],["6","Módulo 3: seguimiento y revisión de medidas","Taller de lectura crítica de informes de programas; evaluación del Módulo 3"],["7","Módulo 4: VIF, riesgo y medidas cautelares","Ejercicio de evaluación de riesgo con casos"],["8","Módulo 4: salidas alternativas y enfoque de género","Análisis de jurisprudencia de la Corte Suprema; evaluación del Módulo 4"],["9","Módulo 5: la opinión técnica oral y la mediación","Simulación de audiencia con opinión oral cronometrada"],["10","Módulo 5: ética, sesgos y cierre","Evaluación del Módulo 5 y retroalimentación final"]]},{"t":"h2","x":"Nota sobre las fuentes"},{"t":"box","title":"Importante para la docente","lines":["Los contenidos se basan en las leyes, el Código Orgánico de Tribunales y las actas de la Corte Suprema que regulan la consejería técnica; en la sistematización que hace la Academia Judicial en su Guía de buenas prácticas para la consejería técnica en tribunales de familia (2026), y en sentencias publicadas por la Corte Suprema, las Cortes de Apelaciones, la Dirección de Estudios de la Corte Suprema y el Observatorio Jurisprudencial de la Facultad de Derecho de la Universidad de Chile.","Antes de cada clase conviene verificar el texto vigente de cada artículo en www.bcn.cl/leychile, las actas en www.pjud.cl y las sentencias en el buscador de jurisprudencia del Poder Judicial (juris.pjud.cl), porque estas normas se modifican con frecuencia. Los resúmenes de fallos de este curso son paráfrasis con fines docentes: para citarlos en un escrito o en clase, conviene leer la sentencia completa."],"kind":"nota"}]},{"title":"Módulo 1. Marco normativo e institucional del consejo técnico","blocks":[{"t":"h2","x":"Objetivos de aprendizaje"},{"t":"ul","items":[{"x":"Identificar las normas que crean, integran y regulan el consejo técnico.","l":0},{"x":"Distinguir la naturaleza jurídica del consejero técnico como auxiliar de la administración de justicia.","l":0},{"x":"Reconocer los límites de la función y las prácticas que la exceden.","l":0},{"x":"Comprender el régimen de implicancias, recusaciones, subrogación y responsabilidad funcionaria.","l":0}]},{"t":"h2","x":"1.1 Creación y naturaleza jurídica"},{"t":"p","x":"La **Ley 19.968**, publicada el 30 de agosto de 2004 y vigente desde octubre de 2005, crea los tribunales de familia y dispone que cada juzgado cuenta con un consejo técnico. La ley lo concibe como parte de la estructura del tribunal, junto a los jueces y la unidad administrativa, y no como un servicio externo al que se recurre ocasionalmente.","it":false},{"t":"p","x":"El **art. 457 del Código Orgánico de Tribunales** define a los consejos técnicos como organismos auxiliares de la administración de justicia, compuestos por profesionales en el número y con los requisitos que establece la ley, cuya función es asesorar individual o colectivamente a los jueces con competencia en asuntos de familia. Esta ubicación en el Título XI del COT, junto a otros auxiliares como los receptores o los defensores públicos, tiene consecuencias prácticas: el consejero no ejerce jurisdicción, pero está sujeto a deberes de imparcialidad y al régimen de implicancias y recusaciones.","it":false},{"t":"p","x":"El **Acta 71-2016 de la Corte Suprema**, que regula el funcionamiento de los tribunales con tramitación electrónica, reitera en su art. 81 que los consejeros técnicos son auxiliares de la administración de justicia, cuya función es asesorar a los jueces de familia conforme al art. 457 del COT, con las atribuciones del art. 5 de la Ley 19.968 y del Acta 93-2005. La misma norma dispone que el registro de la causa debe permitir que cualquier consejero que asista al juez conozca el estado de la causa.","it":false},{"t":"h2","x":"1.2 Requisitos para integrar el consejo técnico"},{"t":"p","x":"El **art. 7 de la Ley 19.968** exige tres requisitos específicos:","it":false},{"t":"ol","items":[{"x":"Título profesional de una carrera de al menos ocho semestres, otorgado por una universidad o instituto profesional del Estado o reconocido por este."},{"x":"Experiencia profesional idónea."},{"x":"Formación especializada en asuntos de familia o infancia de al menos dos semestres, impartida por una universidad o instituto de reconocido prestigio."}]},{"t":"p","x":"A ellos se suman los requisitos generales de ingreso al Poder Judicial del **art. 295 del COT** (entre otros, no haber cesado en un cargo por calificación deficiente o medida disciplinaria y no estar inhabilitado ni condenado por crimen o simple delito). Los concursos se rigen por las bases específicas que publica la Corporación Administrativa del Poder Judicial.","it":false},{"t":"h2","x":"1.3 Funciones legales: el art. 5 de la Ley 19.968"},{"t":"p","x":"La función de los profesionales del consejo técnico es asesorar, individual o colectivamente, a los jueces en el análisis y mayor comprensión de los asuntos sometidos a su conocimiento en el ámbito de su especialidad. En particular, la ley les encomienda:","it":false},{"t":"table","rows":[["Letra","Función","Cómo se expresa en la práctica"],["a)","Asistir a las audiencias de juicio a que sean citados, para emitir las opiniones técnicas que se les soliciten.","Opinión oral en audiencia, registrada en audio, sobre la prueba o la decisión."],["b)","Asesorar al juez para la adecuada comparecencia y declaración del niño, niña o adolescente.","Preparación y acompañamiento de la audiencia reservada; sugerencias sobre modalidad y lenguaje."],["c)","Evaluar, a requerimiento del juez, la pertinencia de derivar a mediación o aconsejar conciliación, y sugerir los términos de esta última.","Opinión sobre equilibrio entre las partes; propuesta de bases de acuerdo."],["d)","Asesorar al juez, a su requerimiento, en la evaluación del riesgo del art. 7 de la Ley 20.066.","Aplicación e interpretación de la evaluación de riesgo en VIF."],["e)","Asesorar al juez en todas las materias relacionadas con su especialidad.","Cláusula general: cualquier asunto en que el saber psicosocial sea útil."]]},{"t":"p","x":"Otras disposiciones de la misma ley concretan estas funciones en etapas específicas del proceso: el **art. 63 N° 4** (presencia del consejo técnico en la audiencia de juicio), el **art. 64** (opinión sobre la prueba rendida), el **art. 73** (asesoría en la audiencia de juicio del procedimiento de protección), el **art. 76** (ponderación de informes de cumplimiento de medidas), el **art. 96** (suspensión condicional de la dictación de la sentencia en VIF) y el **art. 100** (informe previo para el término del proceso a requerimiento de la víctima). Se estudian en los módulos siguientes.","it":false},{"t":"h2","x":"1.4 Funciones complementadas por actas de la Corte Suprema"},{"t":"table","rows":[["Acta","Contenido relevante para la consejería técnica"],["Acta 93-2005","Rol y funciones de los consejeros técnicos en los juzgados de familia: asesoría en su especialidad, asistencia a audiencias, sugerencia de diligencias, propuesta de bases de conciliación y orientación de derivaciones."],["Acta 104-2005","Funcionamiento general de los juzgados de familia."],["Acta 98-2009","Gestión y administración de los tribunales; crea la figura del consejero técnico coordinador y fija directrices de planificación anual."],["Acta 135-2010","Centro de Medidas Cautelares de los juzgados de familia de Santiago, con consejeros de dedicación preferente."],["Acta 37-2014","Seguimiento de medidas de internación y visitas a residencias."],["Acta 237-2014","Espacios adecuados para el ejercicio del derecho de NNA a ser oídos (sala Gesell)."],["Acta 71-2016","Tramitación electrónica; carácter de auxiliar de justicia (art. 81); primera atención en VIF para evitar victimización secundaria."],["AD-826-2016","Organización de turnos y cargas de trabajo en el plan anual; dependencia administrativa y funcional."],["AD-1909-2015","Recomienda que los juzgados no encomienden a los consejeros tareas ajenas a sus funciones."]]},{"t":"h2","x":"1.5 Funciones según las bases de concurso"},{"t":"p","x":"Las bases de concurso para el cargo, que la Academia Judicial sistematiza en su guía de 2026, describen tareas que concretan las funciones legales: elaborar informes técnicos escritos y orales en las causas asignadas; participar en la planificación anual y en reuniones de coordinación; asesorar en protocolos especializados (evaluación de riesgo, sala Gesell, seguimiento de medidas cautelares); mantener coordinación con los organismos colaboradores, y capacitarse en infancia, adolescencia y familia. Estas tareas no amplían la ley: la concretan.","it":false},{"t":"h2","x":"1.6 Límites de la función"},{"t":"p","x":"Que el consejero sea un asesor define tanto lo que hace como lo que no debe hacer. La guía de la Academia Judicial identifica como mala práctica pedirle que redacte proveídos, porque la función de proveer no está en ninguna norma que rija su labor. Del mismo modo, el AD-1909-2015 recomienda no encomendarle tareas sin relación con sus funciones. Un ejemplo que la misma guía menciona: ubicar a los niños cerca de las oficinas del consejo técnico para que los consejeros los cuiden mientras los adultos están en audiencia, práctica que no guarda relación con la especialidad ni con las labores que la ley encomienda.","it":false},{"t":"table","rows":[["Corresponde al consejero técnico","No corresponde al consejero técnico"],["Emitir opiniones técnicas orales o escritas en su especialidad.","Redactar proveídos, resoluciones o sentencias."],["Asesorar en la comparecencia del NNA.","Interrogar al NNA en lugar del juez o decidir si será oído."],["Sugerir diligencias, derivaciones y bases de conciliación.","Ejecutar intervenciones terapéuticas o planes de intervención."],["Ponderar técnicamente informes de programas y pericias.","Actuar como perito de una de las partes."],["Coordinarse con la red para fines de la causa.","Cumplir labores administrativas o de cuidado de niños ajenas a la causa."]]},{"t":"h2","x":"1.7 Implicancias, recusación, subrogación y responsabilidad"},{"t":"p","x":"El **art. 457 del COT** dispone que, cuando por implicancia o recusación un miembro del consejo técnico no puede intervenir en una causa, o se imposibilita para el cargo, lo subrogan los demás miembros del consejo técnico del tribunal, según el orden de sus nombramientos y la especialidad requerida. Si todos están afectados, el juez designa a un profesional que cumpla los requisitos para integrar un consejo técnico de cualquier servicio público, quien está obligado a desempeñar el cargo.","it":false},{"t":"p","x":"Como integrantes del Poder Judicial, los consejeros están sujetos al régimen disciplinario y a los procedimientos internos, incluidos los de investigación de acoso laboral y sexual que regulan las actas de la Corte Suprema. La consecuencia práctica es que la conducta del consejero, dentro y fuera de la audiencia, compromete la imagen de imparcialidad del tribunal.","it":false},{"t":"h2","x":"Jurisprudencia y casos de referencia"},{"t":"fallo","tribunal":"Corte de Apelaciones (caso anonimizado publicado por la Secretaría Técnica de Igualdad de Género y No Discriminación del Poder Judicial)","rol":"reservado","fecha":"2023","materia":"Responsabilidad disciplinaria de un consejero técnico","hechos":"El Comité de Jueces de un juzgado de familia sancionó a un consejero técnico con censura por escrito tras una investigación por acoso. Las denunciantes apelaron.","criterio":"La Corte de Apelaciones aumentó la sanción a suspensión de funciones por 10 días con goce de media remuneración y dispuso una medida de protección para las denunciantes.","leccion":"El consejero técnico es funcionario judicial sujeto al régimen disciplinario. Su conducta en el tribunal es parte de su función y puede ser sancionada."},{"t":"h2","x":"Claves para la práctica (desde la experiencia psicosocial)"},{"t":"ul","items":[{"x":"El cambio central es de rol: en una OPD o un programa especializado se evalúa e interviene; en el tribunal se **traduce el conocimiento técnico para la decisión judicial**.","l":0},{"x":"La pregunta guía siempre es: ¿qué necesita saber el juez para decidir esta materia?","l":0},{"x":"Ante una tarea que excede la función, la respuesta adecuada es colaborativa y fundada: explicar el marco normativo y proponer alternativas dentro del rol.","l":0}]},{"t":"h2","x":"Preguntas de reflexión"},{"t":"ol","items":[{"x":"¿Qué tareas de su trabajo actual en la red de protección no podría realizar como consejera técnica? ¿Por qué?"},{"x":"¿Qué ventajas y qué riesgos tiene para la imparcialidad haber trabajado antes en programas que hoy informan al tribunal?"},{"x":"¿Cómo explicaría a una familia usuaria la diferencia entre el consejero técnico y el profesional del programa que la atiende?"}]},{"t":"eval","mod":1,"qs":[{"q":"Según el art. 457 del COT, los consejos técnicos son:","o":["Unidades del Servicio Nacional de Protección Especializada","Peritos externos designados por las partes","Órganos jurisdiccionales de primera instancia","Organismos auxiliares de la administración de justicia"],"c":3},{"q":"¿Cuál de estas funciones NO está en el art. 5 de la Ley 19.968?","o":["Evaluar la pertinencia de derivar a mediación","Asesorar en la comparecencia y declaración del NNA","Dictar las medidas cautelares en causas de VIF","Asesorar en la evaluación de riesgo del art. 7 de la Ley 20.066"],"c":2},{"q":"La formación especializada exigida por el art. 7 de la Ley 19.968 es de al menos:","o":["Un semestre","Dos semestres","Cuatro semestres","Ocho semestres"],"c":1},{"q":"El título profesional exigido corresponde a una carrera de al menos:","o":["Seis semestres","Ocho semestres","Diez semestres","No se exige duración mínima"],"c":1},{"q":"Si todos los consejeros de un tribunal están implicados, el juez:","o":["Solicita un perito a la parte demandante","Suspende la causa hasta que se nombre un nuevo consejero","Resuelve sin asesoría técnica","Designa a un profesional que cumpla los requisitos para integrar un consejo técnico de cualquier servicio público, quien está obligado a aceptar"],"c":3},{"q":"La figura del consejero técnico coordinador fue creada por:","o":["Acta 237-2014","Ley 21.430","Ley 20.066","Acta 98-2009"],"c":3},{"q":"Pedir a un consejero técnico que redacte proveídos es:","o":["Una práctica permitida si hay sobrecarga","Una obligación según el art. 5 letra e)","Una mala práctica, porque excede el marco normativo de su función","Una función propia según el Acta 93-2005"],"c":2},{"q":"El art. 81 del Acta 71-2016 establece que los consejeros técnicos:","o":["Pueden dictar resoluciones de mero trámite","Dependen del Ministerio de Justicia","Son auxiliares de la administración de justicia que asesoran a los jueces de familia","Son nombrados por las partes"],"c":2},{"q":"La subrogación de un consejero implicado se hace, según el COT:","o":["Por los demás miembros del consejo técnico, según el orden de nombramiento y la especialidad requerida","Por el curador ad litem","Por el administrador del tribunal","Por sorteo entre los abogados del tribunal"],"c":0},{"q":"El AD-1909-2015 recomienda que los juzgados de familia:","o":["Eliminen las audiencias reservadas","Asignen a los consejeros la redacción de actas","No encomienden a los consejeros tareas ajenas a sus funciones","Reemplacen a los consejeros por peritos"],"c":2}],"caso":["**Caso:** Usted es consejera técnica en un juzgado de familia. La administradora del tribunal le pide, por sobrecarga, que redacte las resoluciones de citación en causas de protección, que cuide a los niños en la sala de espera durante las audiencias de sus padres y que realice sesiones de intervención con una familia cuyo caso usted asesoró en audiencia.","Responda: (1) ¿Qué normas regulan su función y qué dicen? (2) ¿Cuáles de estas tareas exceden su rol y por qué? (3) ¿Cómo respondería de manera fundada y colaborativa?"],"rubrica":[{"x":"Identifica las normas pertinentes (art. 5 Ley 19.968, art. 457 COT, Acta 93-2005, AD-1909-2015)","pts":3},{"x":"Distingue asesoría de resolución, intervención y tareas administrativas, para las tres tareas","pts":4},{"x":"Propone una respuesta fundada, respetuosa y con alternativas dentro del rol","pts":3}]}]},{"title":"Módulo 2. Principios rectores: interés superior del niño y derecho a ser oído","blocks":[{"t":"h2","x":"Objetivos de aprendizaje"},{"t":"ul","items":[{"x":"Aplicar el principio del interés superior del niño, niña o adolescente como criterio técnico concreto, no como fórmula genérica.","l":0},{"x":"Asesorar al juez para garantizar el derecho del NNA a ser oído, en forma directa y sin victimización secundaria.","l":0},{"x":"Conocer los criterios de la Corte Suprema que anulan sentencias cuando no se oyó al NNA.","l":0}]},{"t":"h2","x":"2.1 Fuentes normativas"},{"t":"table","rows":[["Norma","Contenido"],["Convención sobre los Derechos del Niño (ratificada por Chile en 1990)","Art. 3: el interés superior del niño como consideración primordial. Art. 12: derecho del niño a expresar su opinión libremente y a que se tenga en cuenta según su edad y madurez, con oportunidad de ser escuchado en todo procedimiento judicial que lo afecte."],["Ley 19.968, art. 16","El interés superior del niño, niña o adolescente y su derecho a ser oído son principios rectores que el juez de familia debe tener siempre como consideración principal. Define niño o niña a quien no ha cumplido 14 años y adolescente a quien tiene entre 14 y menos de 18."],["Ley 19.968, art. 69","En el procedimiento de protección, el juez debe tener debidamente en cuenta las opiniones del NNA según su edad y madurez. Puede oírlo en las audiencias de los arts. 72 y 73 o en una audiencia especial, en un ambiente adecuado que resguarde su salud física y psíquica."],["Ley 21.430 (2022), art. 7","Define el interés superior y los elementos que deben considerarse para determinarlo en concreto, entre ellos la opinión del NNA (inciso 5° letra b)."],["Ley 21.430, art. 11","Autonomía progresiva: los NNA ejercen sus derechos en consonancia con la evolución de sus facultades, según su edad, madurez y grado de desarrollo."],["Ley 21.430, art. 28","Derecho a ser oído en los procedimientos judiciales y administrativos que lo afecten, y deber del Estado de crear mecanismos efectivos para ello."],["Código Civil, art. 242 inc. 2","En las resoluciones sobre la persona del hijo, se consideran sus opiniones según su edad y madurez."],["Acta 237-2014","Espacios adecuados para que el NNA sea oído (sala Gesell)."]]},{"t":"h2","x":"2.2 El interés superior como concepto triple"},{"t":"p","x":"Siguiendo la Observación General N° 14 del Comité de los Derechos del Niño, la Corte Suprema ha entendido el interés superior como un concepto triple: un **derecho sustantivo** (a que su interés se evalúe y sea una consideración primordial), un **principio interpretativo** (ante varias interpretaciones posibles, se elige la que mejor lo satisfaga) y una **norma de procedimiento** (toda decisión debe explicar cómo se evaluó y ponderó ese interés). La Ley 21.430 recoge esta comprensión y exige que el interés superior se determine en concreto, atendiendo a las circunstancias del caso.","it":false},{"t":"p","x":"Para el consejero técnico, la tercera dimensión es la más importante: su opinión es, precisamente, uno de los insumos con que el juez debe mostrar que evaluó el interés del niño. Por eso no basta afirmar que una medida «es en el interés superior del niño»: hay que explicar qué elementos concretos se consideraron (su desarrollo, su dinámica familiar, sus vínculos, el nivel de daño, su opinión) y cómo se ponderaron.","it":false},{"t":"h2","x":"2.3 El derecho a ser oído: contenido y alcance"},{"t":"p","x":"El derecho a ser oído no se agota en un trámite. La jurisprudencia reciente de la Corte Suprema lo vincula con el derecho a defensa en su dimensión material: el niño no es un objeto del proceso sino un sujeto que debe poder participar en la construcción del caso. De ahí se siguen varias consecuencias prácticas:","it":false},{"t":"ul","items":[{"x":"El NNA debe ser informado del objeto del juicio en un lenguaje que comprenda.","l":0},{"x":"Puede ser oído más de una vez, en cualquier etapa, si lo desea. La guía de la Academia Judicial recomienda entrevistarlo todas las veces que manifieste su deseo de ser escuchado.","l":0},{"x":"Oír al NNA es un derecho, no una obligación para él: puede no querer hablar, y esa voluntad puede comunicarse por medio de su abogado o representante. La Academia Judicial califica como mala práctica exigirle concurrir al tribunal solo para decir que no quiere ser escuchado.","l":0},{"x":"Su opinión se pondera según su edad y madurez, junto con los demás elementos del interés superior. Oírlo no significa hacer lo que pide, ni trasladarle la responsabilidad de la decisión.","l":0}]},{"t":"h2","x":"2.4 La audiencia reservada o confidencial"},{"t":"p","x":"La audiencia reservada es la forma más directa de materializar el derecho a ser oído. La guía de la Academia Judicial y la Guía para la conducción de las audiencias de familia recomiendan prepararla y realizarla en colaboración con la consejera o consejero técnico. El juez la conduce personalmente; el consejero asesora sobre la modalidad, el lenguaje, los tiempos y la contención.","it":false},{"t":"table","rows":[["Etapa","Aporte del consejero técnico"],["Preparación","Revisar antecedentes de la causa; evaluar edad, madurez, estado emocional y riesgo de victimización; sugerir modalidad (sala Gesell, sala de audiencia adaptada), horario y acompañamiento; coordinar con el juez los temas a abordar."],["Inicio","Recibir al NNA por su nombre (o nombre social); explicarle quiénes están, para qué se le escucha, que puede no responder y qué pasará con lo que diga."],["Desarrollo","Asesorar al juez en el lenguaje, el ritmo y la contención; evitar preguntas sugestivas o que lo obliguen a elegir entre sus padres; abordar todos los aspectos que sean de su interés y no solo los hechos de la causa."],["Cierre","Agradecer, explicar los pasos siguientes y verificar su estado emocional antes de que salga."],["Después","Ayudar al juez a ponderar la opinión según la madurez y el contexto (posibles influencias, lealtades), sin trasladar la decisión al NNA."]]},{"t":"box","title":"Buenas y malas prácticas en la escucha (Guía Academia Judicial, 2026)","lines":["**Buena práctica:** informar al NNA que tiene derecho a ser escuchado, pero que no es una obligación.","**Buena práctica:** escucharlo cada vez que manifieste su deseo de hablar, en cualquier etapa del proceso.","**Mala práctica:** exigirle concurrir personalmente al tribunal para decir que no desea ser escuchado, cuando ya lo informó a su abogado.","**Mala práctica:** reducir la audiencia a preguntar con cuál de los padres quiere vivir."],"kind":"nota"},{"t":"h2","x":"Jurisprudencia relevante"},{"t":"p","x":"La Corte Suprema ha anulado en forma reiterada sentencias de familia porque no se oyó al niño, aplicando la causal de nulidad del art. 768 N° 9 del Código de Procedimiento Civil (falta de un trámite o diligencia esencial). Los fallos siguientes muestran la evolución de ese criterio.","it":false},{"t":"fallo","tribunal":"Corte Suprema","rol":"124-2015","fecha":"18 de agosto de 2015","materia":"Derecho a ser oído como trámite esencial","hechos":"Causa de familia en que no se recabó la opinión del niño. El fallo es citado, entre otros, por la Corte de Apelaciones de Valdivia en su sentencia Rol 207-2016.","criterio":"El derecho del niño a ser oído comprende el de expresar su parecer, y la enumeración legal de trámites esenciales no es taxativa: su omisión puede viciar el procedimiento.","leccion":"La escucha del NNA no es un trámite opcional. La asesoría del consejero para que se realice en condiciones adecuadas resguarda también la validez del proceso."},{"t":"fallo","tribunal":"Corte Suprema","rol":"35.252-2016","fecha":"2016","materia":"Niña de 11 años no oída directamente","hechos":"Se resolvió un asunto que afectaba a una niña de once años sin escucharla directa y debidamente.","criterio":"El art. 12 de la Convención está incorporado al derecho interno y obliga a dar al niño la oportunidad de ser escuchado. A los once años la niña ya goza de un «germen de autonomía» que debe respetarse. Se aplicaron los arts. 768 N° 9 y 800 del CPC y el art. 16 de la Ley 19.968.","leccion":"La edad no es un umbral fijo: la autonomía es progresiva y el consejero debe ayudar a evaluar la madurez concreta del NNA."},{"t":"fallo","tribunal":"Corte Suprema, Cuarta Sala","rol":"15.277-2025","fecha":"14 de enero de 2026","materia":"Impugnación y reclamación de paternidad","hechos":"Durante el juicio no se escuchó a los niños involucrados, quienes desconocían por completo el objeto del juicio y no pudieron expresar sus sentimientos, deseos o temores.","criterio":"El derecho a ser oído es una expresión del derecho a defensa en su dimensión material. No basta consultar al niño una vez ni ofrecerle alternativas cerradas: debe poder participar en la construcción del caso. Se aplicaron el art. 12 de la Convención, los arts. 7 y 28 de la Ley 21.430, el art. 242 del Código Civil y el art. 16 de la Ley 19.968. La Corte acogió la casación en la forma, anuló la sentencia de alzada e invalidó lo obrado para que los niños fueran oídos.","leccion":"El consejero debe asesorar para que el NNA sea informado del objeto del juicio y escuchado de forma abierta, no con preguntas de opción cerrada."},{"t":"fallo","tribunal":"Corte Suprema","rol":"40.161-2025","fecha":"29 de mayo de 2026","materia":"Cuidado personal de una niña de 7 años","hechos":"Se ordenó citar a la niña, pero no asistió a las cuatro audiencias de juicio. Se dejó constancia de que no fue escuchada directamente por su edad, por haber sido entrevistada por el curador ad litem y por acuerdo de ambos padres. El Juzgado de Familia de Talca otorgó el cuidado personal al padre y la Corte de Apelaciones confirmó.","criterio":"La entrevista del curador ad litem no basta para cumplir el derecho a ser oído, que exige una oportunidad real y directa ante el tribunal. Ese derecho no puede quedar supeditado al consentimiento de los padres. La Corte invalidó de oficio lo obrado para que la niña fuera oída. Hubo voto disidente: estimó que la niña fue oída a través del curador y que era prudente evitarle optar entre sus padres.","leccion":"El voto de mayoría y el de minoría muestran la tensión que el consejero debe ayudar a resolver: escuchar directamente al NNA sin exponerlo a elegir entre sus padres. La respuesta técnica está en la modalidad de la escucha, no en omitirla."},{"t":"h2","x":"Claves para la práctica"},{"t":"ul","items":[{"x":"Oír al NNA no es lo mismo que hacer lo que pide: su opinión se considera según su edad y madurez, junto con los demás elementos del interés superior.","l":0},{"x":"Fundamentar siempre el interés superior con los elementos concretos que señala el art. 7 de la Ley 21.430, no como fórmula genérica.","l":0},{"x":"La entrevista de otros intervinientes (curador ad litem, programa, perito) no reemplaza la escucha directa por el tribunal, según el criterio actual de la Corte Suprema.","l":0},{"x":"Si el NNA no puede o no quiere asistir, el consejero puede sugerir alternativas (otro horario, otra sala, acompañamiento) en vez de dar por cumplido el trámite.","l":0}]},{"t":"h2","x":"Preguntas de reflexión"},{"t":"ol","items":[{"x":"En su experiencia en la red, ¿cómo se recogía la opinión de los niños? ¿Qué cambia cuando quien escucha es un juez?"},{"x":"¿Cómo distinguiría, en una audiencia reservada, la opinión propia del NNA de un discurso influido por un adulto, sin desacreditar lo que dice?"},{"x":"¿Qué haría si el juez quiere terminar la audiencia reservada en cinco minutos con una sola pregunta?"}]},{"t":"eval","mod":2,"qs":[{"q":"El art. 16 de la Ley 19.968 establece como principios rectores:","o":["La celeridad y la mediación","El interés superior del NNA y su derecho a ser oído","La gratuidad y la publicidad","La oralidad y la concentración"],"c":1},{"q":"¿Qué ley define los elementos para determinar en concreto el interés superior del NNA?","o":["Ley 19.947","Ley 21.378","Ley 21.430","Ley 20.066"],"c":2},{"q":"La asesoría para la adecuada comparecencia del NNA corresponde al art. 5 de la Ley 19.968, letra:","o":["a)","b)","c)","d)"],"c":1},{"q":"El Acta 237-2014 se refiere a:","o":["El Centro de Medidas Cautelares","El monitoreo telemático","Espacios adecuados para que el NNA sea oído (sala Gesell)","Visitas a residencias"],"c":2},{"q":"Según el art. 16 de la Ley 19.968, se considera adolescente a quien:","o":["Tiene más de 16 años","Tiene entre 14 y menos de 18 años","Tiene entre 12 y 18 años","Ha cumplido 18 años"],"c":1},{"q":"La opinión del NNA debe considerarse:","o":["Según su edad y grado de madurez","Solo a partir de los 14 años","Únicamente si coincide con la de sus padres","Siempre como vinculante"],"c":0},{"q":"En la sentencia Rol 40.161-2025, la Corte Suprema resolvió que la entrevista del curador ad litem:","o":["No basta para cumplir el derecho de la niña a ser oída directamente","Hace innecesaria la audiencia reservada si los padres están de acuerdo","Reemplaza la escucha directa por el tribunal","Debe ser repetida por el consejero técnico"],"c":0},{"q":"La causal de nulidad aplicada por la Corte Suprema cuando no se oye al NNA es:","o":["Art. 768 N° 9 del CPC, falta de un trámite o diligencia esencial","La falta de emplazamiento del curador","Art. 768 N° 1 del CPC, incompetencia","La prescripción de la acción"],"c":0},{"q":"Según la guía de la Academia Judicial, exigir al NNA que concurra al tribunal solo para decir que no quiere ser escuchado es:","o":["Una buena práctica de transparencia","Una mala práctica; su voluntad puede comunicarse por su abogado o representante","Una función del consejero técnico","Una obligación legal"],"c":1},{"q":"En la sentencia Rol 15.277-2025, la Corte Suprema vinculó el derecho a ser oído con:","o":["La publicidad de las audiencias","El derecho de propiedad de los padres","La mediación previa obligatoria","El derecho a defensa en su dimensión material"],"c":3}],"caso":["**Caso:** Matías, de 9 años, es citado en una causa de cuidado personal entre sus padres. El padre pide que el niño declare en la sala de audiencia frente a ambos. La madre se opone a que sea oído y propone que baste con la entrevista que le hizo su curadora ad litem. El juez le pide su asesoría.","Responda: (1) ¿Qué normas y qué criterio jurisprudencial fundamentan su asesoría? (2) ¿Qué modalidad de escucha recomendaría y por qué? (3) ¿Cómo orientaría al juez para ponderar lo que diga Matías?"],"rubrica":[{"x":"Cita normas pertinentes (arts. 5 b y 16 Ley 19.968; arts. 7 y 28 Ley 21.430; CDN art. 12; Acta 237-2014) y el criterio de la CS sobre el curador ad litem","pts":3},{"x":"Recomienda una modalidad protegida y directa, y descarta fundadamente ambas propuestas de los padres","pts":4},{"x":"Orienta la ponderación según edad y madurez, sin trasladar la decisión al niño","pts":3}]}]},{"title":"Módulo 3. Protección de derechos de niños, niñas y adolescentes","blocks":[{"t":"h2","x":"Objetivos de aprendizaje"},{"t":"ul","items":[{"x":"Conocer el procedimiento de aplicación judicial de medidas de protección y el rol del consejero en cada etapa.","l":0},{"x":"Asesorar en la adopción, seguimiento y revisión de medidas, en articulación con la red de protección.","l":0},{"x":"Analizar críticamente los informes de los programas y la proporcionalidad de las medidas.","l":0}]},{"t":"h2","x":"3.1 Marco general: protección administrativa y judicial"},{"t":"p","x":"Con la **Ley 21.430** sobre Garantías y Protección Integral de los Derechos de la Niñez y Adolescencia (2022), Chile estableció un sistema que distingue la protección administrativa, a cargo de las **Oficinas Locales de la Niñez (OLN)**, y la protección judicial, que corresponde a los tribunales de familia cuando la vulneración exige una medida que solo un juez puede adoptar o cuando la vía administrativa no es suficiente. La **Ley 21.302** creó el **Servicio Nacional de Protección Especializada a la Niñez y Adolescencia**, que sucedió al SENAME en el área de protección y del que dependen los programas especializados y el cuidado alternativo.","it":false},{"t":"p","x":"Para quien viene de la red, este punto es clave: el tribunal no es la primera puerta de entrada a la protección, sino una instancia que actúa cuando la gravedad o la complejidad del caso lo exigen. La asesoría del consejero ayuda al juez a distinguir cuándo una medida judicial es necesaria y cuándo basta el apoyo de la red.","it":false},{"t":"h2","x":"3.2 El procedimiento de protección en la Ley 19.968"},{"t":"p","x":"El procedimiento de aplicación judicial de medidas de protección está regulado en el **Título IV, Párrafo 1°, arts. 68 a 80 bis de la Ley 19.968**. El siguiente cuadro resume las etapas y el rol del consejero:","it":false},{"t":"table","rows":[["Etapa","Norma","Rol del consejero técnico"],["Inicio de oficio o a requerimiento; medidas cautelares","Arts. 68 y 71","Asesorar sobre la urgencia, pertinencia y proporcionalidad de medidas cautelares en resguardo del NNA."],["Escucha del NNA","Art. 69","Asesorar para que el niño sea oído en las audiencias de los arts. 72 y 73 o en audiencia especial, en ambiente adecuado."],["Audiencia preparatoria","Art. 72","Opinar sobre los antecedentes, las diligencias y la prueba necesarias."],["Audiencia de juicio","Art. 73","El juez puede asesorarse por el consejo técnico, incluso para objetar informes periciales."],["Sentencia y medidas","Arts. 74 y 75","Aportar criterios técnicos para la medida más idónea y menos gravosa."],["Cumplimiento y revisión","Art. 76 inc. final","El juez se asesora por uno o más consejeros al ponderar los informes de cumplimiento de las medidas."]]},{"t":"p","x":"Este párrafo ha sido modificado varias veces, entre otras por la Ley 21.302. Antes de clases conviene leer su texto vigente.","it":true},{"t":"h2","x":"3.3 Criterios técnicos para recomendar una medida"},{"t":"p","x":"La recomendación del consejero debe poder explicarse con criterios verificables. Los siguientes surgen de los principios de la Ley 21.430 y de la jurisprudencia sobre interés superior:","it":false},{"t":"table","rows":[["Criterio","Pregunta que orienta la opinión"],["Necesidad","¿Existe una vulneración actual o un riesgo concreto que la red no puede abordar sin una medida judicial?"],["Idoneidad","¿La medida propuesta responde a la causal identificada?"],["Proporcionalidad y menor intervención","¿Existe una medida menos gravosa que logre el mismo fin? La separación del NNA de su familia es el último recurso."],["Preferencia por la familia","¿Se exploró la familia extensa u otros adultos significativos antes del cuidado residencial?"],["Estabilidad y pertenencia","¿La medida preserva los vínculos, la escolaridad y el entorno del NNA?"],["Temporalidad y revisión","¿Tiene plazos, objetivos y forma de verificar su cumplimiento?"],["Opinión del NNA","¿Se oyó al NNA y se ponderó su opinión según su madurez?"]]},{"t":"h2","x":"3.4 Lectura crítica de los informes de los programas"},{"t":"p","x":"Una de las tareas más frecuentes del consejero en protección es ayudar al juez a ponderar los informes de cumplimiento que remiten los programas (art. 76). Quien viene de la red conoce estos informes desde dentro, lo que es una ventaja, pero también un riesgo: la opinión en el tribunal debe ser imparcial y no defender al programa ni a la institución de origen.","it":false},{"t":"table","rows":[["Aspecto del informe","Qué revisar"],["Objetivos","¿Están vinculados a la causal que motivó la medida?"],["Intervenciones","¿Qué se hizo, con qué frecuencia y con quién? ¿Hubo cambios de profesional?"],["Adherencia","¿La inasistencia se explica por resistencia, por barreras de acceso o por fallas del programa?"],["Resultados","¿Hay avances verificables y no solo declaraciones generales?"],["Voz del NNA","¿El informe recoge la opinión del niño?"],["Recomendación","¿Es coherente con lo informado? ¿Propone plazos concretos?"]]},{"t":"h2","x":"3.5 Seguimiento de medidas de internación"},{"t":"p","x":"El **Acta 37-2014** de la Corte Suprema regula el seguimiento de las medidas de internación y las visitas a residencias. Los consejeros participan en estas tareas, que buscan verificar las condiciones en que se encuentran los NNA bajo cuidado alternativo y que la medida se revise periódicamente.","it":false},{"t":"h2","x":"Jurisprudencia relevante"},{"t":"p","x":"La Dirección de Estudios de la Corte Suprema analizó la aplicación del interés superior en la jurisprudencia de la Segunda y la Cuarta Sala (2019). De ese estudio se extraen los siguientes criterios, útiles para fundar opiniones en protección y cuidado personal:","it":false},{"t":"fallo","tribunal":"Corte Suprema, Cuarta Sala","rol":"41.051-2016","fecha":"2016","materia":"Protección y familia extensa","hechos":"Causa de protección en que se discutía el cuidado de una niña.","criterio":"Se consideró razonable que la niña encontrara protección y afecto en su familia de origen, en particular en sus abuelos maternos y su hermano.","leccion":"Antes de recomendar el cuidado residencial, el consejero debe explorar la familia extensa y los vínculos significativos."},{"t":"fallo","tribunal":"Corte Suprema, Cuarta Sala","rol":"11.782-2014","fecha":"2014","materia":"Estabilidad y sentimiento de pertenencia","hechos":"Demanda de cuidado personal que buscaba modificar una situación estable de la niña.","criterio":"Se confirmó el rechazo de la demanda porque alterar una situación estable vulneraría el derecho de la niña a un entorno de pertenencia, esencial para su desarrollo.","leccion":"La estabilidad es un elemento técnico relevante del interés superior: un cambio debe justificarse en un beneficio concreto para el NNA."},{"t":"fallo","tribunal":"Corte Suprema, Cuarta Sala","rol":"4.827-2017","fecha":"2017","materia":"Cuidado personal centrado en el niño","hechos":"Discusión sobre las reglas de cuidado personal de los arts. 225 y 225-2 del Código Civil.","criterio":"Las reglas de cuidado personal deben interpretarse centradas en el niño como sujeto de derechos; los derechos de los padres son deberes orientados a su bien.","leccion":"La opinión técnica debe centrarse en las necesidades del NNA, no en la disputa entre los adultos."},{"t":"fallo","tribunal":"Corte Suprema, Cuarta Sala","rol":"5.127-2014 y 6.323-2015","fecha":"2014 y 2015","materia":"Ponderación de informes y prueba","hechos":"Recursos que cuestionaban la valoración de la prueba, incluidos informes técnicos.","criterio":"La apreciación de la prueba conforme a la sana crítica es facultad de los jueces del fondo, revisable solo si se infringen sus reglas.","leccion":"Como la valoración de los informes la hace el juez de primera instancia, la calidad de la asesoría del consejero en esa etapa es decisiva: difícilmente será corregida después."},{"t":"h2","x":"Claves para la práctica (desde PRM-OPD al tribunal)"},{"t":"ul","items":[{"x":"El saber de la red permite evaluar la idoneidad de una derivación, pero la opinión en el tribunal debe ser imparcial.","l":0},{"x":"Al revisar informes, preguntar siempre: ¿hay avances verificables?, ¿se mantiene la causal?, ¿la medida sigue siendo necesaria y proporcional?","l":0},{"x":"Si existe una causal de implicancia por haber intervenido antes en el caso, debe informarse.","l":0}]},{"t":"h2","x":"Preguntas de reflexión"},{"t":"ol","items":[{"x":"¿Qué informes de programas le resultaron más útiles en su trabajo? ¿Qué les faltaba para servir a una decisión judicial?"},{"x":"¿Cuándo prorrogar una medida protege al NNA y cuándo solo posterga una decisión?"},{"x":"¿Cómo incorporaría la opinión de un adolescente que rechaza la medida dispuesta?"}]},{"t":"eval","mod":3,"qs":[{"q":"El procedimiento de aplicación judicial de medidas de protección está en la Ley 19.968, arts.:","o":["81 a 101","68 a 80 bis","16 a 20","103 a 114"],"c":1},{"q":"Según el art. 76 inc. final, el consejero asesora al juez al:","o":["Fijar la pensión de alimentos","Admitir la demanda","Dictar la sentencia definitiva","Ponderar los informes de cumplimiento de medidas de protección"],"c":3},{"q":"El art. 73 permite al juez asesorarse por el consejo técnico incluso para:","o":["Objetar informes periciales","Dictar la sentencia","Designar curador ad litem","Notificar a las partes"],"c":0},{"q":"El Acta 37-2014 regula:","o":["El seguimiento de medidas de internación y visitas a residencias","La sala Gesell","La mediación familiar","El Centro de Medidas Cautelares"],"c":0},{"q":"El Servicio Nacional de Protección Especializada fue creado por:","o":["Ley 19.968","Ley 21.302","Acta 71-2016","Ley 20.066"],"c":1},{"q":"Un criterio técnico central para recomendar una medida es que sea:","o":["La que solicite el programa de origen","La más gravosa disponible","Siempre la internación","Idónea, necesaria y proporcional"],"c":3},{"q":"La protección administrativa en el sistema de la Ley 21.430 corresponde principalmente a:","o":["Los juzgados de familia","Las Oficinas Locales de la Niñez","La Defensoría Penal Pública","El Ministerio Público"],"c":1},{"q":"Según el art. 69 de la Ley 19.968, en el procedimiento de protección el NNA puede ser oído:","o":["Solo por escrito","Únicamente a través del programa","En las audiencias de los arts. 72 y 73 o en una audiencia especial, en ambiente adecuado","Solo en la audiencia de juicio"],"c":2},{"q":"En la sentencia Rol 11.782-2014, la Corte Suprema valoró especialmente:","o":["La preferencia materna","La opinión del abogado","La estabilidad y el sentimiento de pertenencia de la niña","La situación económica del demandante"],"c":2},{"q":"Un consejero que trabajó antes en el programa que ejecuta la medida debe:","o":["Pedir que el programa redacte su opinión","Abstenerse siempre de toda causa de protección","Opinar con imparcialidad y, si hay causal, informar su implicancia","Defender el trabajo del programa"],"c":2}],"caso":["**Caso:** Un programa de intervención informa que una madre no ha asistido a 4 de 8 sesiones en tres meses y pide prorrogar la medida por seis meses. El informe no explica las inasistencias ni recoge la opinión de la niña, de 12 años, quien en audiencia reservada refirió estar bien en su casa y querer seguir en su colegio. La abuela materna vive en la misma comuna. El juez le pide su opinión en la audiencia de revisión.","Responda: (1) ¿Qué normas fundamentan su intervención? (2) ¿Qué elementos analizaría del informe y de la situación de la niña? (3) Formule una opinión técnica breve (máximo 10 líneas)."],"rubrica":[{"x":"Fundamenta en el art. 76 y en los principios (art. 16 Ley 19.968; art. 7 Ley 21.430)","pts":2},{"x":"Analiza críticamente el informe (adherencia, objetivos, voz de la niña) y considera la red familiar","pts":4},{"x":"Formula una opinión clara, concreta, proporcional y con plazos verificables","pts":4}]}]},{"title":"Módulo 4. Violencia intrafamiliar y violencia de género","blocks":[{"t":"h2","x":"Objetivos de aprendizaje"},{"t":"ul","items":[{"x":"Aplicar la evaluación de riesgo en VIF conforme a la ley y a los protocolos vigentes.","l":0},{"x":"Asesorar en medidas cautelares, salidas alternativas y término del proceso con enfoque de género.","l":0},{"x":"Reconocer las formas de violencia que define la Ley 21.675, incluida la violencia vicaria.","l":0}]},{"t":"h2","x":"4.1 Fuentes normativas"},{"t":"table","rows":[["Norma","Contenido relevante"],["Ley 20.066, art. 5","Define la violencia intrafamiliar."],["Ley 20.066, art. 7","Situaciones de riesgo inminente que obligan al tribunal a adoptar medidas de protección o cautelares."],["Ley 20.066, art. 9","Medidas accesorias (por ejemplo, abandono del hogar común y prohibición de acercarse a la víctima)."],["Ley 19.968, art. 5 letra d)","El consejero asesora al juez, a su requerimiento, en la evaluación del riesgo del art. 7 de la Ley 20.066."],["Ley 19.968, arts. 81 y siguientes","Procedimiento relativo a los actos de violencia intrafamiliar de competencia de los juzgados de familia."],["Ley 19.968, art. 92","Medidas cautelares en protección de la víctima."],["Ley 19.968, art. 92 bis","Informe de evaluación de riesgo elaborado por las policías o por el consejo técnico (verificar su numeración: la guía de la Academia Judicial lo cita también como «62 bis»)."],["Ley 19.968, art. 96","Suspensión condicional de la dictación de la sentencia."],["Ley 19.968, art. 100","Término del proceso; inc. 2°: término a requerimiento de la víctima, previo informe del consejo técnico."],["Ley 21.378","Monitoreo telemático en VIF y estatus legal de la pauta de evaluación de riesgo."],["Ley 21.675 (2024)","Ley integral sobre violencia contra las mujeres. Art. 3: derecho a una vida libre de violencia. Art. 5: definición de violencia de género; su inc. 2 incorpora la violencia vicaria. Art. 33: situación de riesgo inminente de violencia de género."],["Acta 135-2010","Centro de Medidas Cautelares de los juzgados de familia de Santiago."],["Acta 71-2016","Primera atención directa en VIF para evitar la victimización secundaria."]]},{"t":"h2","x":"4.2 La evaluación de riesgo"},{"t":"p","x":"La evaluación de riesgo es la función más característica del consejero en VIF, porque de ella dependen medidas urgentes que limitan derechos del denunciado y protegen a la víctima. La ley encarga al consejo técnico asesorar en la evaluación del riesgo del art. 7 de la Ley 20.066 y, en los casos que señala la Ley 19.968, elaborar el informe de evaluación de riesgo cuando la víctima no fue entrevistada por las policías.","it":false},{"t":"h3","x":"Modalidades de aplicación de la pauta (según la guía de la Academia Judicial)"},{"t":"ul","items":[{"x":"Llamada telefónica a la víctima.","l":0},{"x":"Atención presencial en el tribunal.","l":0},{"x":"Citación en las denuncias no presenciales.","l":0},{"x":"Aplicación en audiencia.","l":0},{"x":"Si la denuncia es espontánea, la pauta se aplica de inmediato; en los demás casos, dentro de 24 horas.","l":0},{"x":"Tras tres intentos fallidos de contacto, se deja constancia.","l":0}]},{"t":"h3","x":"Factores que la asesoría debe considerar"},{"t":"table","rows":[["Ámbito","Ejemplos de factores"],["Hechos","Gravedad y frecuencia de la violencia; escalada reciente; amenazas de muerte; uso o acceso a armas; violencia sexual; intentos de estrangulamiento."],["Agresor","Incumplimiento de medidas anteriores; consumo problemático de alcohol o drogas; celos y control; antecedentes de violencia."],["Víctima","Embarazo; discapacidad; edad avanzada; aislamiento; percepción de riesgo de la propia víctima."],["Contexto","Separación reciente; dependencia económica o habitacional; hijos en común; redes de apoyo; condición migratoria."],["NNA","Exposición de hijos a la violencia; uso de los hijos para dañar a la madre (violencia vicaria)."]]},{"t":"p","x":"El art. 33 de la Ley 21.675 incorpora el análisis de la situación de riesgo inminente de violencia de género. Con enfoque de género, la evaluación debe considerar las dependencias económicas y afectivas, los vínculos con los hijos y la posibilidad de que la retractación de la víctima responda a esas dependencias y no a la desaparición del riesgo.","it":false},{"t":"h2","x":"4.3 Medidas cautelares y monitoreo telemático"},{"t":"p","x":"El consejero puede recomendar medidas cautelares de protección de la víctima (por ejemplo, prohibición de acercamiento o salida del ofensor del hogar común), fundadas en la evaluación de riesgo. La **Ley 21.378** permite el monitoreo telemático, cuya recomendación se vincula a una evaluación de riesgo alto. En Santiago, el **Centro de Medidas Cautelares** (Acta 135-2010) concentra esta función con consejeros de dedicación preferente.","it":false},{"t":"h2","x":"4.4 Salidas alternativas y término del proceso"},{"t":"table","rows":[["Norma","Contenido","Rol del consejero"],["Art. 96 Ley 19.968","Suspensión condicional de la dictación de la sentencia","Asesorar al juez para asegurar que las partes negocien libremente y en igualdad de condiciones."],["Art. 100 inc. 2 Ley 19.968","Si el proceso se inició por demanda o denuncia de un tercero, el juez puede ponerle término en la audiencia preparatoria a requerimiento de la víctima, que debe expresar su voluntad en forma libre y espontánea.","Informe previo: evaluar si la voluntad es libre y espontánea y si persiste el riesgo."],["Ley 21.378","Monitoreo telemático","Recomendación vinculada a una evaluación de riesgo alto."]]},{"t":"h2","x":"4.5 Buenas prácticas"},{"t":"ul","items":[{"x":"**Separación de funciones:** la guía de la Academia Judicial recomienda que el consejero que atendió a la denunciante no emita luego la opinión en juicio, para resguardar la imparcialidad.","l":0},{"x":"**Evitar la victimización secundaria:** no pedir a la víctima que repita su relato si ya consta; usar el registro existente.","l":0},{"x":"**Enfoque de género:** analizar dependencias, vínculos con los hijos y riesgo de violencia vicaria; evitar estereotipos sobre cómo «debería» comportarse una víctima.","l":0},{"x":"**Personas mayores:** respetar su autonomía y su derecho a ser oídas, sin desatender el riesgo (Convención Interamericana sobre la Protección de los Derechos Humanos de las Personas Mayores).","l":0}]},{"t":"h2","x":"Jurisprudencia relevante"},{"t":"fallo","tribunal":"Corte Suprema","rol":"25.069-2024","fecha":"25 de julio de 2024","materia":"VIF y violencia de género: amenazas sobre el cuidado personal","hechos":"El padre de un niño de 5 años amenazó a la madre con quitarle el cuidado personal y cuestionó sus capacidades como mujer y madre. Sostuvo que esas amenazas eran el ejercicio de un derecho. El tribunal de primera instancia lo condenó como autor de VIF, con multa y asistencia obligatoria a programas, y la Corte de Apelaciones confirmó, estimando que las amenazas buscaban dañar, angustiar y controlar a la madre.","criterio":"La Corte Suprema rechazó la casación: el establecimiento de los hechos corresponde a los jueces del fondo, y con los hechos establecidos se configuraba la VIF del art. 5 de la Ley 20.066.","leccion":"Las amenazas sobre los hijos pueden ser una forma de control y violencia. El consejero debe identificar estas dinámicas y no tratarlas como un simple conflicto parental."},{"t":"fallo","tribunal":"Corte Suprema, Cuarta Sala","rol":"15.278-2025","fecha":"19 de junio de 2025","materia":"Autorización de salida del país en contexto de violencia de género","hechos":"Una madre con cáncer avanzado y sin redes en Chile pidió autorización para que su hija viajara a Paraguay con la abuela materna. La madre había sufrido violencia de género del padre, incluido hostigamiento mediante acciones judiciales. El padre se opuso.","criterio":"La Corte rechazó la casación y confirmó la autorización por 24 meses, con escolarización y continuidad del tratamiento. Aplicó la Ley 21.675 (arts. 3 y 5, incluida la violencia vicaria) y la Observación General N° 14. Precisó que la perspectiva de género no se usó para desacreditar al padre, sino para identificar un estereotipo en la familia paterna.","leccion":"La violencia vicaria y el derecho del NNA a crecer sin violencia son elementos del interés superior que el consejero debe considerar en materias que no son, formalmente, de VIF."},{"t":"fallo","tribunal":"Corte Suprema","rol":"38.704-2025","fecha":"19 de noviembre de 2025","materia":"VIF contra persona mayor y término del proceso (art. 100)","hechos":"Los hijos de un hombre mayor demandaron por VIF a su pareja, por supuesta manipulación, violencia económica y maltrato. El tribunal desestimó la demanda: consideró que la víctima no estaba en situación de riesgo y que pidió terminar el procedimiento.","criterio":"La Corte rechazó la casación. Estimó que la víctima pidió en forma expresa y reiterada terminar el procedimiento, que basta con que ese requerimiento conste, y que la curadora ad litem también pidió el rechazo. Se invocaron los arts. 7 y 31 de la Convención Interamericana sobre los Derechos de las Personas Mayores (autonomía y derecho a ser oído).","leccion":"En el término a requerimiento de la víctima, el informe del consejo técnico es clave para acreditar que la voluntad es libre y que no persiste el riesgo. Una evaluación bien fundada protege tanto la autonomía como la seguridad de la víctima."},{"t":"h2","x":"Preguntas de reflexión"},{"t":"ol","items":[{"x":"¿Cómo distinguiría, en una entrevista breve, una retractación libre de una retractación por miedo o dependencia?"},{"x":"¿Qué tensiones aparecen entre el respeto a la autonomía de una persona mayor y su protección frente a la violencia económica?"},{"x":"¿Qué estereotipos de género ha observado en informes o audiencias, y cómo los evitaría en su propia opinión técnica?"}]},{"t":"eval","mod":4,"qs":[{"q":"El art. 7 de la Ley 20.066 se refiere a:","o":["El cuidado personal","La mediación previa obligatoria","Las situaciones de riesgo inminente","Los alimentos provisorios"],"c":2},{"q":"La asesoría en la evaluación de ese riesgo está en el art. 5 de la Ley 19.968, letra:","o":["a)","b)","c)","d)"],"c":3},{"q":"Según la guía de la Academia Judicial, en una denuncia espontánea la pauta de evaluación de riesgo se aplica:","o":["En la audiencia de juicio","Dentro de 72 horas","De inmediato","Solo si la víctima lo pide"],"c":2},{"q":"En la suspensión condicional del art. 96, el consejero asesora para asegurar:","o":["Que el proceso termine rápido","Que se aplique monitoreo telemático","Que el denunciado acepte su responsabilidad","Que las partes negocien libremente y en igualdad de condiciones"],"c":3},{"q":"El término del proceso del art. 100 inc. 2 procede:","o":["Solo después de la audiencia de juicio","En cualquier causa, a petición del denunciado","Si el proceso se inició por demanda o denuncia de un tercero, a requerimiento de la víctima y previo informe del consejo técnico","Solo con acuerdo del Ministerio Público"],"c":2},{"q":"El monitoreo telemático en VIF está regulado por:","o":["Ley 21.378","Ley 19.947","Ley 21.302","Acta 37-2014"],"c":0},{"q":"El Centro de Medidas Cautelares de los juzgados de familia de Santiago se rige por:","o":["Acta 237-2014","AD-1909-2015","Acta 93-2005","Acta 135-2010"],"c":3},{"q":"La violencia vicaria está incorporada en:","o":["El Acta 98-2009","El art. 457 del COT","El art. 5 inc. 2 de la Ley 21.675","El art. 16 de la Ley 19.968"],"c":2},{"q":"En la sentencia Rol 25.069-2024, la Corte Suprema mantuvo la condena por VIF de un padre que:","o":["Se negó a la mediación","Incumplió el pago de alimentos","Amenazó a la madre con quitarle el cuidado personal y cuestionó sus capacidades como mujer y madre","Cambió de domicilio sin aviso"],"c":2},{"q":"La guía de la Academia Judicial recomienda que el consejero que atendió a la denunciante:","o":["No emita luego la opinión en el juicio, para resguardar la imparcialidad","Redacte la sentencia","Sea el único que opine en el juicio","Represente a la víctima en audiencia"],"c":0}],"caso":["**Caso:** La hermana de una mujer denuncia por escrito que la expareja de esta la amenaza. La mujer tiene dos hijos con él, depende económicamente de él y él tiene armas inscritas. La policía no logró entrevistarla. En la audiencia preparatoria, la mujer pide terminar el proceso porque «ya se arreglaron» y él ya no la amenaza. El juez le pide su informe.","Responda: (1) ¿Qué normas aplican a su asesoría? (2) ¿Qué factores de riesgo identifica y cómo los evaluaría? (3) ¿Qué informaría al juez respecto del requerimiento de término del art. 100?"],"rubrica":[{"x":"Identifica normas (Ley 20.066 art. 7; Ley 19.968 arts. 5 d, 92 bis y 100; Ley 21.675) y advierte que la denuncia es de un tercero","pts":3},{"x":"Evalúa el riesgo con enfoque de género (dependencia económica, armas, hijos en común, retractación)","pts":4},{"x":"Informa sobre el término en forma fundada, evaluando si la voluntad es libre y espontánea","pts":3}]}]},{"title":"Módulo 5. Asesoría en audiencia, mediación y elaboración de la opinión técnica","blocks":[{"t":"h2","x":"Objetivos de aprendizaje"},{"t":"ul","items":[{"x":"Ejercer la asesoría oral y escrita en audiencia con claridad, fundamento e imparcialidad.","l":0},{"x":"Evaluar la pertinencia de la mediación y proponer bases de conciliación.","l":0},{"x":"Integrar principios éticos y control de sesgos en la opinión técnica.","l":0}]},{"t":"h2","x":"5.1 La asesoría en audiencia"},{"t":"p","x":"La opinión del consejero en audiencia es, por regla general, oral y queda registrada en el audio de la causa, en presencia de las partes. Esto la distingue del informe pericial: el consejero no es perito de ninguna de las partes, sino asesor del juez, y su opinión puede ser conocida y comentada por los intervinientes. La Ley 19.968 la prevé en varios momentos:","it":false},{"t":"ul","items":[{"x":"**Art. 63 N° 4:** en la audiencia de juicio, el juez puede disponer la presencia de uno o más miembros del consejo técnico.","l":0},{"x":"**Art. 64:** el juez puede pedir la opinión de un consejero sobre la prueba rendida, en el ámbito de su especialidad.","l":0},{"x":"**Art. 73:** asesoría en la audiencia de juicio del procedimiento de protección, incluso para objetar informes periciales.","l":0}]},{"t":"h2","x":"5.2 Modalidades de ejercicio"},{"t":"table","rows":[["Modalidad","Cuándo se usa"],["Individual (regla general)","Opinión oral en audiencia o escrita a solicitud del juez: medidas cautelares, cuidado personal o relación directa y regular provisorios."],["Dupla psicosocial (excepcional)","Opinión conjunta de psicólogo y trabajador social en casos de alta complejidad."],["Consejo colegiado (excepcional)","Opinión unificada del consejo en casos complejos."],["Consejero preferente","Un mismo profesional sigue la causa para dar continuidad; no equivale a radicación y su ausencia no invalida lo obrado."]]},{"t":"h2","x":"5.3 Mediación y conciliación"},{"t":"p","x":"El **art. 5 letra c)** encarga al consejero evaluar, a requerimiento del juez, la pertinencia de derivar a mediación o de aconsejar conciliación, y sugerir los términos de esta última. Para hacerlo, debe conocer las reglas de la mediación familiar del **Título V de la Ley 19.968 (arts. 103 y siguientes)**.","it":false},{"t":"h3","x":"Art. 106: mediación previa, voluntaria y prohibida"},{"t":"table","rows":[["Categoría","Materias o situaciones"],["Mediación previa obligatoria","Alimentos, cuidado personal y relación directa y regular, aunque se discutan en un juicio de divorcio o separación. Excepciones: casos del art. 54 de la Ley 19.947, mediación previa acreditada ante mediador inscrito, o acuerdo privado de las partes."],["Mediación voluntaria","Las demás materias de competencia de los juzgados de familia, si las partes lo acuerdan o lo aceptan."],["Materias excluidas","Estado civil (salvo la Ley de Matrimonio Civil), declaración de interdicción, maltrato de NNA y adopción."],["Situaciones en que no procede ninguna mediación","Condena previa por VIF o anotaciones en el registro especial del art. 12 de la Ley 20.066 por agredir a la otra parte; medida cautelar o de protección vigente entre las partes; suspensión condicional de la sentencia o del procedimiento."]]},{"t":"h3","x":"Criterios técnicos para opinar sobre mediación o conciliación"},{"t":"ul","items":[{"x":"Equilibrio de poder entre las partes y capacidad de negociar en igualdad.","l":0},{"x":"Ausencia de violencia y de las situaciones que excluyen la mediación (art. 106).","l":0},{"x":"Centralidad del interés del NNA: un acuerdo entre adultos no es válido si lo perjudica.","l":0},{"x":"Viabilidad: que el acuerdo propuesto sea concreto, gradual si es necesario, y verificable.","l":0}]},{"t":"h2","x":"5.4 Estructura de la opinión técnica oral"},{"t":"ol","items":[{"x":"**Materia y pregunta técnica** que se responde."},{"x":"**Antecedentes considerados** (informes, entrevistas, registro de audiencia, audiencia reservada)."},{"x":"**Análisis técnico** desde la especialidad, vinculado a los principios legales (interés superior, derecho a ser oído, proporcionalidad)."},{"x":"**Sugerencia concreta,** proporcional y verificable (qué, quién, cuándo, cómo se revisa)."},{"x":"**Límites de la opinión:** lo que no puede afirmarse con los antecedentes disponibles."}]},{"t":"box","title":"Ejemplo breve de opinión oral (relación directa y regular)","lines":["«Su Señoría, se me consulta sobre la pertinencia de un régimen provisorio de relación directa y regular. Consideré la demanda, el informe del programa y lo que el niño expresó en la audiencia reservada. Desde el punto de vista técnico, se observa un vínculo afectivo con el padre interrumpido hace un año, sin antecedentes de violencia hacia el niño. El temor de la madre requiere ser evaluado, pero con los antecedentes actuales no se configura un riesgo que justifique suspender el contacto. Sugiero un régimen gradual y supervisado, una vez por semana por dos horas durante dos meses, con un informe del centro antes de ampliarlo. No es posible pronunciarse sobre un régimen con pernoctación sin una evaluación más completa.»"],"kind":"gris"},{"t":"h2","x":"5.5 Ética, autonomía y sesgos"},{"t":"ul","items":[{"x":"**Independencia técnica:** el juez no orienta ni modifica el contenido de la opinión; puede acogerla o no.","l":0},{"x":"**Imparcialidad:** implicancias y recusaciones conforme al art. 457 del COT.","l":0},{"x":"**Control de sesgos:** la Academia Judicial dedica un capítulo de su guía a sesgos, prejuicios y estereotipos, y recomienda el análisis colegiado de casos para reducirlos. Los más frecuentes en familia son el sesgo de confirmación, los estereotipos de género sobre la maternidad y la paternidad, y el sesgo de clase.","l":0},{"x":"**Lenguaje:** claro, sin diagnósticos clínicos que excedan lo evaluado y sin calificativos sobre las personas.","l":0}]},{"t":"h2","x":"Jurisprudencia relevante"},{"t":"fallo","tribunal":"Corte de Apelaciones de Santiago","rol":"168-2025","fecha":"1 de diciembre de 2025","materia":"Relación directa y regular; consumo de drogas del padre","hechos":"La madre pidió suspender la relación directa y regular de su hija con el padre, por el consumo de drogas de este. El contacto estaba suspendido desde 2021. El tribunal oyó a la niña en audiencia reservada y pidió la opinión del consejero técnico, quien sugirió rechazar la demanda y restablecer el contacto en forma gradual. El tribunal rechazó la demanda y ordenó una revinculación progresiva y supervisada.","criterio":"La Corte rechazó la casación en la forma y la apelación: el fallo analizó la prueba conforme a la sana crítica, consideró la opinión del consejero técnico y respetó el interés superior de la niña (art. 7 Ley 21.430). Agregó que el padre debía someterse a tratamiento.","leccion":"Una opinión técnica concreta, que propone un camino gradual y verificable, puede ser adoptada por el juez y confirmada en segunda instancia."},{"t":"fallo","tribunal":"Corte Suprema","rol":"40.161-2025","fecha":"29 de mayo de 2026","materia":"La opinión de otros intervinientes no sustituye la escucha directa","hechos":"Ver Módulo 2.","criterio":"La entrevista del curador ad litem no basta para cumplir el derecho de la niña a ser oída directamente por el tribunal.","leccion":"Del mismo modo, la opinión del consejero técnico sobre lo que el NNA quiere no reemplaza la audiencia reservada: el consejero asesora la escucha, no la sustituye."},{"t":"h2","x":"Preguntas de reflexión"},{"t":"ol","items":[{"x":"¿Cuál es la diferencia entre la opinión técnica del consejero y un informe pericial? ¿Por qué importa?"},{"x":"¿Qué haría si el juez le pide su opinión en el momento, sin haber leído los antecedentes?"},{"x":"¿Qué sesgos reconoce en su propia práctica profesional, y qué estrategias usaría para controlarlos?"}]},{"t":"eval","mod":5,"qs":[{"q":"Según el art. 63 N° 4 de la Ley 19.968, en la audiencia de juicio el juez puede:","o":["Disponer la presencia de uno o más consejeros","Ordenar mediación obligatoria","Prescindir de la prueba","Delegar la sentencia en el consejo técnico"],"c":0},{"q":"La regla general de actuación del consejero es:","o":["Colegiada","A través de un perito externo","En dupla","Individual"],"c":3},{"q":"El consejero preferente:","o":["Reemplaza al juez","Debe ser psicólogo","Da continuidad a la causa, y su ausencia no invalida lo obrado","Equivale a radicación formal"],"c":2},{"q":"La evaluación de la pertinencia de la mediación está en el art. 5 de la Ley 19.968, letra:","o":["a)","b)","c)","e)"],"c":2},{"q":"Según el art. 106, NO procede la mediación cuando:","o":["Las partes tienen hijos en común","Las partes viven en distintas comunas","Existe una medida cautelar o de protección vigente entre las partes","La materia es de alimentos"],"c":2},{"q":"Son materias de mediación previa obligatoria:","o":["Alimentos, cuidado personal y relación directa y regular","Adopción e interdicción","Maltrato de NNA","Estado civil"],"c":0},{"q":"Para reducir sesgos, la Academia Judicial recomienda:","o":["Evitar escuchar al NNA","Usar solo instrumentos estandarizados","El análisis colegiado de casos","Que el juez revise la opinión antes de emitirla"],"c":2},{"q":"Una opinión técnica adecuada debe incluir:","o":["La opinión personal del consejero sobre las partes","Solo la conclusión","Un diagnóstico clínico completo","Una sugerencia concreta y los límites de lo que puede afirmarse"],"c":3},{"q":"En la sentencia Rol 168-2025, la Corte de Apelaciones de Santiago confirmó un fallo que:","o":["Ordenó una revinculación progresiva y supervisada, considerando la opinión del consejero técnico","Suspendió indefinidamente el contacto","Prohibió la audiencia reservada","Derivó la causa a mediación obligatoria"],"c":0},{"q":"La opinión del consejero técnico en audiencia:","o":["Es un informe pericial de parte","Es una asesoría al juez, por regla general oral y registrada, que el juez puede acoger o no","Obliga al juez","Debe ser aprobada por los abogados"],"c":1}],"caso":["**Caso:** En una audiencia preparatoria de relación directa y regular, el juez le pide opinión oral en el momento. El padre no ve a su hijo de 6 años hace un año; la madre se opone por «miedo», sin denuncias previas ni medidas cautelares vigentes. Ambos manifiestan disposición a conversar.","Responda: (1) Formule su opinión oral siguiendo la estructura del punto 5.4 (máximo 15 líneas). (2) ¿Recomendaría mediación o conciliación? Fundamente con los arts. 5 c) y 106. (3) ¿Qué sesgos podrían influir en su opinión y cómo los controlaría?"],"rubrica":[{"x":"Opinión estructurada, clara y fundada, con sugerencia verificable","pts":4},{"x":"Evalúa mediación o conciliación con los arts. 5 c) y 106 y con criterios técnicos","pts":3},{"x":"Identifica sesgos y estrategias concretas para controlarlos","pts":3}]}]},{"title":"Anexo 1. Escala de notas con exigencia del 75 %","blocks":[{"t":"p","x":"Fórmula (nota mínima 1,0; nota de aprobación 4,0 con el 75 % del puntaje; nota máxima 7,0):","it":false},{"t":"ul","items":[{"x":"Si el puntaje (P) es menor que el 75 % del puntaje máximo (Pmax): Nota = 1 + 3 × P / (0,75 × Pmax).","l":0},{"x":"Si P es igual o mayor que el 75 % de Pmax: Nota = 4 + 3 × (P − 0,75 × Pmax) / (0,25 × Pmax).","l":0}]},{"t":"p","x":"Tabla para eval
